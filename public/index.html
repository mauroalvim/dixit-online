<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dixit Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Poppins', sans-serif; 
            text-align: center; 
            min-height: 100vh;
            background-color: #0d1117;
            background-image: 
                radial-gradient(circle at 15% 30%, rgba(138, 43, 226, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 85% 70%, rgba(0, 191, 255, 0.15) 0%, transparent 50%),
                linear-gradient(180deg, #10141f 0%, #06080c 100%);
            background-attachment: fixed;
            color: white; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h1 { font-weight: 800; font-size: 2.5em; text-shadow: 0px 4px 15px rgba(0,0,0,0.8); margin: 20px 0; color: #fff; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 25px 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px; 
            margin-bottom: 20px;
        }

        button { 
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white; 
            border: none; 
            border-radius: 25px; 
            padding: 14px 24px; 
            font-size: 16px; 
            font-weight: 600;
            width: 100%; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(110, 142, 251, 0.3);
            transition: 0.3s;
            margin-top: 15px;
        }
        button:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(110, 142, 251, 0.5); }
        .btn-cancel { background: linear-gradient(135deg, #ff416c, #ff4b2b); box-shadow: 0 4px 15px rgba(255, 65, 108, 0.3); }

        input { 
            width: 100%; 
            padding: 14px; 
            font-size: 16px; 
            border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.2); 
            background: rgba(0,0,0,0.3);
            color: white;
            text-align: center; 
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: 0.3s;
            margin-top: 10px;
        }
        input:focus { border-color: #a777e3; background: rgba(0,0,0,0.5); }
        
        #hand { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 12px; 
            margin-top: 20px; 
            width: 100%;
        }
        .card { 
            width: calc(33.33% - 12px); 
            max-width: 130px; 
            aspect-ratio: 2 / 3; 
            height: auto;
            border-radius: 12px; 
            cursor: pointer; 
            object-fit: cover; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            border: 3px solid transparent; 
            transition: 0.3s; 
            background: rgba(255,255,255,0.05); /* Fundo sutil enquanto carrega */
        }
        .card:hover { transform: translateY(-8px); border-color: #a777e3; }
        
        .my-card-disabled { opacity: 0.3; cursor: not-allowed; border-color: #ff4b2b !important; transform: none !important; }
        .narrator-card-view { cursor: default; }
        .narrator-card-view:hover { transform: none; border-color: transparent; }
        .locked-card { opacity: 0.7; filter: grayscale(30%); }
        .locked-card:hover { transform: none; border-color: transparent; cursor: wait; }
        
        .ranking-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: rgba(0,0,0,0.4); border-radius: 12px; overflow: hidden; }
        .ranking-table th, .ranking-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .ranking-table th { background: rgba(255,255,255,0.1); color: #a777e3; font-size: 14px; text-transform: uppercase; }
        
        .status-text { margin-bottom: 15px; font-size: 1.1em; line-height: 1.4; }
        .winner-title { font-size: 2em; color: #f1c40f; text-shadow: 0 0 20px rgba(241, 196, 15, 0.6); animation: pulse 2s infinite; margin: 20px 0; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); backdrop-filter: blur(8px); padding: 20px; }
        .modal-content { position: relative; top: 50%; transform: translateY(-50%); background: #161b22; padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; margin: 0 auto; box-shadow: 0 20px 50px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.1); }
        .modal-img { width: 100%; max-height: 55vh; object-fit: contain; border-radius: 12px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Dixit Online ✨</h1>
    
    <div id="initialMenu" class="glass-panel">
        <h3 style="margin-bottom: 20px;">Bem-vindo ao Jogo!</h3>
        <input type="text" id="globalPlayerName" placeholder="Digite seu Apelido">
        
        <div style="background: rgba(0,0,0,0.2); padding: 20px; border-radius: 15px; margin-top: 25px;">
            <h4 style="color: #f1c40f; margin-bottom: 10px;">👑 Criar Nova Partida</h4>
            <label style="font-size: 13px; opacity: 0.8;">Pontos para Vencer (Ex: 30):</label>
            <input type="number" id="targetScoreInput" value="30">
            <button onclick="showCreateRoom()">Criar Sala como Host</button>
        </div>
        
        <div style="background: rgba(0,0,0,0.2); padding: 20px; border-radius: 15px; margin-top: 15px;">
            <h4 style="color: #38ef7d; margin-bottom: 10px;">🎮 Já tem um convite?</h4>
            <button onclick="showJoinRoom()" style="background: rgba(255,255,255,0.1); box-shadow: none; border: 1px solid rgba(255,255,255,0.2);">Entrar em uma Sala</button>
        </div>
    </div>

    <div id="joinForm" class="glass-panel" style="display:none;">
        <h3 style="margin-bottom: 15px;">Entrar na Sala</h3>
        <p style="font-size: 14px; opacity: 0.8; margin-bottom: 15px;">Peça o código de 4 números para o criador da sala.</p>
        <input type="number" id="roomId" placeholder="Código (Ex: 1234)">
        <button onclick="joinRoom()">Conectar</button>
        <button onclick="backToMenu()" class="btn-cancel">Voltar</button>
    </div>

    <div id="game" class="glass-panel" style="display:none; max-width: 600px;">
        <h2 id="roomCodeDisplay" style="color: #a777e3; margin-bottom: 10px;"></h2>
        
        <div id="playersList" style="opacity: 0.8; margin-bottom: 20px; font-size: 14px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px;"></div>
        
        <div id="dynamicMessages">
            <h3 id="waitingMessage" style="color: #f1c40f; display:none;">Aguardando outros jogadores entrarem...</h3>
            <h3 id="loadingMessage" style="color: #38ef7d; display:none;">🪄 Pintando cartas surrealistas... Isso pode levar alguns segundos, aguarde!</h3>
            <div id="actionInstruction" class="status-text"></div>
        </div>
        
        <button id="startBtn" style="display:none;" onclick="startGame()">Iniciar Partida</button>
        
        <div id="hand"></div>
    </div>

    <div id="cardModal" class="modal">
        <div class="modal-content">
            <img id="modalImage" class="modal-img" src="">
            <div id="modalButtons">
                <button id="btnConfirmModal" class="btn-confirm" onclick="handleConfirmModal()">Confirmar</button>
                <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myRoomId = '';
        let selectedCardUrl = '';
        let myPlayedCardUrl = ''; 
        let modalAction = 'PLAY'; 
        let myHandElements = [];
        let amINarrator = false;
        let narratorHasPlayed = false;

        // Função mágica que tenta carregar a imagem em loop invisível se a IA falhar na primeira vez
        function loadAndRetryImage(imgElement, originalUrl, onSuccess) {
            let attempts = 0;
            const tryLoad = (urlToTry) => {
                imgElement.onload = () => {
                    if (onSuccess) onSuccess();
                };
                imgElement.onerror = () => {
                    attempts++;
                    // Espera 2 segundos e engana o cache do navegador colocando um timestamp falso
                    setTimeout(() => {
                        tryLoad(originalUrl + '&retry=' + new Date().getTime() + attempts);
                    }, 2000);
                };
                imgElement.src = urlToTry;
            };
            tryLoad(originalUrl);
        }

        function showCreateRoom() {
            const name = document.getElementById('globalPlayerName').value;
            const targetScore = document.getElementById('targetScoreInput').value;
            if(!name) return alert("Por favor, digite seu apelido!");
            socket.emit('createRoom', { targetScore: targetScore, playerName: name });
        }

        function showJoinRoom() {
            const name = document.getElementById('globalPlayerName').value;
            if(!name) return alert("Por favor, digite seu apelido!");
            document.getElementById('initialMenu').style.display = 'none';
            document.getElementById('joinForm').style.display = 'block';
        }

        function backToMenu() {
            document.getElementById('joinForm').style.display = 'none';
            document.getElementById('initialMenu').style.display = 'block';
        }
        
        socket.on('roomCreated', ({ roomId, players }) => {
            myRoomId = roomId;
            document.getElementById('initialMenu').style.display = 'none';
            document.getElementById('joinForm').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            document.getElementById('roomCodeDisplay').innerText = 'Sala: ' + roomId;
            document.getElementById('waitingMessage').style.display = 'block';
            updatePlayersList(players);
        });

        function joinRoom() {
            const room = document.getElementById('roomId').value;
            const name = document.getElementById('globalPlayerName').value;
            if(!room) return alert("Digite o código da sala!");
            socket.emit('joinRoom', { roomId: room, playerName: name });
        }

        socket.on('joinedSuccess', ({ roomId }) => {
            myRoomId = roomId;
            document.getElementById('initialMenu').style.display = 'none';
            document.getElementById('joinForm').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            document.getElementById('roomCodeDisplay').innerText = 'Sala: ' + roomId;
            document.getElementById('waitingMessage').style.display = 'none'; 
        });

        socket.on('joinError', ({ message }) => alert(message));

        socket.on('playerJoined', ({ players }) => {
            updatePlayersList(players);
            if (players.length > 1) {
                document.getElementById('waitingMessage').style.display = 'none';
                if(document.getElementById('roomCodeDisplay').innerText.includes('Sala:')) {
                    document.getElementById('startBtn').style.display = 'block';
                }
            }
        });

        function updatePlayersList(players) {
            document.getElementById('playersList').innerHTML = '<strong>Jogadores:</strong> ' + players.map(p => p.name).join(', ');
        }

        function startGame() { socket.emit('startGame', { roomId: myRoomId }); }
        function nextRound() { socket.emit('nextRound', { roomId: myRoomId }); }

        socket.on('gameStarted', ({ players }) => {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('waitingMessage').style.display = 'none';
            document.getElementById('actionInstruction').innerHTML = '';
            document.getElementById('hand').innerHTML = ''; 
            document.getElementById('loadingMessage').style.display = 'block'; 
            
            const me = players.find(p => p.id === socket.id);
            if(me) {
                amINarrator = me.isNarrator;
                narratorHasPlayed = false;
                myPlayedCardUrl = ''; 
                myHandElements = [];
                let loadedCount = 0;
                const totalImages = me.hand.length;

                me.hand.forEach(url => {
                    const img = new Image();
                    img.className = 'card';
                    
                    img.onclick = () => {
                        if (!amINarrator && !narratorHasPlayed) {
                            alert("Calma! Você precisa esperar o Narrador falar a dica e colocar a carta dele na mesa primeiro.");
                            return;
                        }
                        openModal(img.src, 'PLAY'); // Pega a URL final com retry
                    };

                    // Usa o novo sistema de Retry Invisível
                    loadAndRetryImage(img, url, () => {
                        loadedCount++;
                        if (loadedCount === totalImages) {
                            // SÓ MANDA O OK QUANDO 100% DAS IMAGENS TIVEREM CARREGADO
                            socket.emit('imagesLoaded', { roomId: myRoomId });
                        }
                    });

                    myHandElements.push(img);
                });
            }
        });

        socket.on('allClientsReady', () => {
            document.getElementById('loadingMessage').style.display = 'none';
            const instructionDiv = document.getElementById('actionInstruction');
            const handDiv = document.getElementById('hand');
            
            if(amINarrator) {
                instructionDiv.innerHTML = '<span style="color:#38ef7d; font-weight:800; font-size:1.2em;">Você é o Narrador!</span><br>Escolha uma carta e fale sua dica em voz alta.';
            } else {
                instructionDiv.innerHTML = '<span style="color:#f1c40f; font-weight:600;">Aguarde...</span><br>O Narrador está pensando na dica. Analise suas cartas enquanto isso!';
            }
            
            myHandElements.forEach(img => {
                if (!amINarrator && !narratorHasPlayed) img.classList.add('locked-card');
                handDiv.appendChild(img);
            });
        });

        socket.on('narratorPlayed', () => {
            narratorHasPlayed = true;
            if (!amINarrator) {
                const instructionDiv = document.getElementById('actionInstruction');
                instructionDiv.innerHTML = '<span style="color:#6e8efb; font-weight:800; font-size:1.2em;">Sua Vez!</span><br>O Narrador deu a dica. Escolha a sua carta.';
                myHandElements.forEach(img => img.classList.remove('locked-card'));
            }
        });

        socket.on('startVotingPhase', ({ cards }) => {
            const instructionDiv = document.getElementById('actionInstruction');
            const handDiv = document.getElementById('hand');
            handDiv.innerHTML = '';
            
            if (amINarrator) {
                instructionDiv.innerHTML = '<span style="color:#f1c40f;">Hora da Votação!</span><br>Aguarde os jogadores votarem (Você não vota).';
            } else {
                instructionDiv.innerHTML = '<span style="color:#a777e3; font-weight:800; font-size:1.2em;">Votação!</span><br>Qual destas é a carta do narrador?';
            }

            cards.forEach(url => {
                const img = document.createElement('img');
                img.className = 'card';
                
                // Usa o sistema de Retry invisível nas cartas da votação também
                loadAndRetryImage(img, url, () => {
                    if (amINarrator) {
                        img.classList.add('narrator-card-view');
                        img.onclick = () => alert("Você é o narrador! Apenas observe a votação.");
                    } else if (img.src.includes(myPlayedCardUrl.split('&retry')[0])) { 
                        // Verifica ignorando o carimbo de retry
                        img.classList.add('my-card-disabled');
                        img.onclick = () => alert("Você não pode votar na sua própria carta!");
                    } else {
                        img.onclick = () => openModal(img.src, 'VOTE');
                    }
                });
                
                handDiv.appendChild(img);
            });
        });

        socket.on('roundEnded', ({ ranking, isGameOver, targetScore, hostSocketId }) => {
            const instructionDiv = document.getElementById('actionInstruction');
            instructionDiv.innerHTML = '';
            
            let html = ``;
            if (isGameOver) {
                const vencedor = ranking[0].name;
                html += `<div class="winner-title">🏆 ${vencedor} VENCEU! 🏆</div>`;
            } else {
                html += `<h3 style="color: #a777e3; margin-bottom: 10px;">Fim da Rodada!</h3>`;
            }

            html += `
                <table class="ranking-table">
                    <tr><th>Pos.</th><th>Jogador</th><th>Pts</th></tr>
            `;

            ranking.forEach((p, index) => {
                let rowStyle = (index === 0) ? 'color: #f1c40f; font-weight: bold; background: rgba(241,196,15,0.1);' : '';
                let isNar = p.isNarrator ? '<br><span style="font-size:11px; color:#38ef7d;">(Narrador)</span>' : '';
                html += `
                    <tr style="${rowStyle}">
                        <td style="font-size:1.2em;">${index + 1}º</td>
                        <td>${p.name} ${isNar}</td>
                        <td style="font-size:1.3em;">${p.score}</td>
                    </tr>`;
            });
            html += `</table>`;

            if (!isGameOver && socket.id === hostSocketId) {
                html += `<button onclick="nextRound()" style="background: linear-gradient(135deg, #f1c40f, #e67e22);">Próxima Rodada</button>`;
            } else if (!isGameOver) {
                html += `<p style="margin-top:20px; font-size:14px; opacity:0.8;">Aguardando o Host iniciar a próxima rodada...</p>`;
            } else if (isGameOver && socket.id === hostSocketId) {
                html += `<button onclick="window.location.reload()" style="background: linear-gradient(135deg, #11998e, #38ef7d);">Jogar Novamente</button>`;
            }

            document.getElementById('hand').innerHTML = html;
        });

        function openModal(url, action) {
            selectedCardUrl = url;
            modalAction = action;
            document.getElementById('modalImage').src = url;
            
            const btnConfirm = document.getElementById('btnConfirmModal');
            if (action === 'PLAY') {
                btnConfirm.innerText = 'Enviar Carta';
                btnConfirm.style.background = 'linear-gradient(135deg, #11998e, #38ef7d)';
            } else if (action === 'VOTE') {
                btnConfirm.innerText = 'Confirmar Voto';
                btnConfirm.style.background = 'linear-gradient(135deg, #a777e3, #6e8efb)'; 
            }
            document.getElementById('cardModal').style.display = 'block';
        }

        function closeModal() { document.getElementById('cardModal').style.display = 'none'; selectedCardUrl = ''; }

        function handleConfirmModal() {
            if(!selectedCardUrl) return;
            
            if (modalAction === 'PLAY') {
                myPlayedCardUrl = selectedCardUrl; 
                socket.emit('playCard', { roomId: myRoomId, cardUrl: selectedCardUrl });
                document.getElementById('hand').innerHTML = '';
                document.getElementById('actionInstruction').innerHTML = '<span style="color: #38ef7d;">Carta na mesa!</span><br>Aguardando os outros jogadores...';
            } else if (modalAction === 'VOTE') {
                socket.emit('voteCard', { roomId: myRoomId, cardUrl: selectedCardUrl });
                document.getElementById('hand').innerHTML = '';
                document.getElementById('actionInstruction').innerHTML = '<span style="color: #6e8efb;">Voto registrado!</span><br>Aguardando apuração...';
            }
            closeModal();
        }
    </script>
</body>
</html>
