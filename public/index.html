<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dixit Online</title>
    <style>
        /* Estilo Profissional e Comercial Restaurado */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: #1a1a24;
            color: #ffffff;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #header-section { padding: 40px 20px 30px; width: 100%; }
        h1 { font-size: 2.5em; color: #f1c40f; margin-bottom: 5px; font-weight: 700; }
        .subtitle { color: #c0c0d0; font-size: 1.1em; font-weight: 400; }

        .form-section {
            background-color: #2a2a36;
            width: 100%;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .input-group { width: 100%; max-width: 400px; margin-bottom: 20px; }
        
        input {
            width: 100%; padding: 16px; font-size: 16px; background-color: #1a1a24;
            border: 1px solid #3e3e50; border-radius: 8px; color: white; outline: none; transition: border-color 0.2s;
        }
        input:focus { border-color: #9b59b6; }
        input::placeholder { color: #6e6e80; }

        button {
            width: 100%; max-width: 400px; padding: 16px; font-size: 16px; font-weight: 600;
            border: none; border-radius: 8px; cursor: pointer; color: white; transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; transform: scale(0.98); }

        .btn-purple { background-color: #9b59b6; margin-bottom: 20px; }
        .btn-green { background-color: #2ecc71; }
        .btn-red { background-color: #e74c3c; margin-top: 10px;}
        .btn-yellow { background-color: #f1c40f; color: #1a1a24; margin-top: 20px; }

        .divider { color: #6e6e80; margin: 10px 0 20px 0; font-size: 14px; text-transform: uppercase; }

        #game { display: none; width: 100%; max-width: 800px; padding: 20px; }
        #roomCodeDisplay { font-size: 1.5em; color: #f1c40f; margin-bottom: 15px; }
        
        .status-box { background-color: #2a2a36; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 1.1em; border: 1px solid #3e3e50; }

        #hand { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-top: 20px; }
        .card {
            width: calc(33.33% - 15px); max-width: 150px; aspect-ratio: 2 / 3; border-radius: 10px; cursor: pointer;
            border: 2px solid transparent; background-color: #1a1a24; background-size: cover; background-position: center;
            transition: transform 0.2s, border-color 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .card:hover { transform: translateY(-5px); border-color: #9b59b6; }
        .locked-card { opacity: 0.5; filter: grayscale(50%); cursor: not-allowed; }
        .locked-card:hover { transform: none; border-color: transparent; }

        .ranking-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #2a2a36; border-radius: 8px; overflow: hidden; }
        .ranking-table th, .ranking-table td { padding: 12px; border-bottom: 1px solid #3e3e50; text-align: center; }
        .ranking-table th { background: #1a1a24; color: #9b59b6; }
        
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); padding: 20px; overflow-y: auto; }
        .modal-content { margin: auto; background: #2a2a36; padding: 20px; border-radius: 12px; max-width: 400px; border: 1px solid #3e3e50; }
        .modal-img { width: 100%; border-radius: 8px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <!-- LOBBY INICIAL -->
    <div id="initialMenu" style="width: 100%; display: flex; flex-direction: column; align-items: center; flex: 1;">
        <div id="header-section">
            <h1>🎩 Dixit Online</h1>
            <p class="subtitle">Um jogo de imaginação e sonhos</p>
        </div>
        <div class="form-section">
            <div class="input-group">
                <input type="text" id="playerName" placeholder="Digite seu Nickname">
            </div>
            <button class="btn-purple" onclick="handleCreateRoom()">Criar Nova Sala</button>
            <div class="divider">OU</div>
            <div class="input-group">
                <input type="text" id="roomCode" placeholder="Código da Sala">
            </div>
            <button class="btn-green" onclick="handleJoinRoom()">Entrar na Sala</button>
        </div>
    </div>

    <!-- TELA DE JOGO -->
    <div id="game">
        <h2 id="roomCodeDisplay"></h2>
        <div class="status-box">
            <div id="playersList" style="margin-bottom: 10px; font-weight: bold; color: #9b59b6;"></div>
            <div id="actionInstruction">Aguardando jogadores...</div>
        </div>
        <button id="startBtn" class="btn-green" style="display:none; max-width: 100%;" onclick="startGame()">Iniciar Partida</button>
        <div id="hand"></div>
    </div>

    <!-- MODAL DE ZOOM NA CARTA -->
    <div id="cardModal" class="modal">
        <div class="modal-content">
            <img id="modalImage" class="modal-img" src="" alt="Carta Ampliada">
            <button id="btnConfirmModal" class="btn-green" onclick="handleConfirmModal()">Confirmar</button>
            <button class="btn-red" onclick="closeModal()">Cancelar</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myRoomId = '', selectedCardUrl = '', myPlayedCardUrl = '';
        let modalAction = 'PLAY', myHandElements = [], amINarrator = false, narratorHasPlayed = false;
        
        const $ = id => document.getElementById(id);

        function handleCreateRoom() {
            const name = $('playerName').value.trim();
            if (!name) return alert("Por favor, digite seu Nickname primeiro!");
            socket.emit('createRoom', { targetScore: 30, playerName: name });
        }

        function handleJoinRoom() {
            const name = $('playerName').value.trim();
            const code = $('roomCode').value.trim();
            if (!name) return alert("Por favor, digite seu Nickname!");
            if (!code) return alert("Por favor, digite o Código da Sala!");
            socket.emit('joinRoom', { roomId: code, playerName: name });
        }

        socket.on('joinError', ({ message }) => alert(message));

        socket.on('generatingDeck', () => {
            $('initialMenu').style.display = 'none';
            $('game').style.display = 'block';
            $('roomCodeDisplay').innerText = '🪄 A invocar a IA...';
            $('actionInstruction').innerHTML = '<span style="color:#2ecc71;">A criar um baralho infinito de arte surreal. Aguarde...</span>';
            $('playersList').innerHTML = '';
            $('startBtn').style.display = 'none';
        });

        socket.on('roomCreated', ({ roomId, players }) => enterGameScreen(roomId, players));
        socket.on('joinedSuccess', ({ roomId }) => enterGameScreen(roomId, []));

        function enterGameScreen(roomId, players) {
            myRoomId = roomId;
            $('initialMenu').style.display = 'none';
            $('game').style.display = 'block';
            $('roomCodeDisplay').innerText = 'Sala: ' + roomId;
            $('actionInstruction').innerHTML = 'Aguardando jogadores...';
            if(players.length > 0) updatePlayersList(players);
        }

        socket.on('playerJoined', ({ players }) => {
            updatePlayersList(players);
            if (players.length > 1) {
                if ($('roomCodeDisplay').innerText.includes('Sala:')) $('startBtn').style.display = 'block';
            }
        });

        function updatePlayersList(players) {
            $('playersList').innerHTML = 'Jogadores: ' + players.map(p => p.name).join(', ');
        }

        function startGame() { socket.emit('startGame', { roomId: myRoomId }); }
        function nextRound() { socket.emit('nextRound', { roomId: myRoomId }); }

        function appendCardToBoard(url, isVotingPhase = false) {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card';
            
            const img = new Image();
            img.onload = () => { cardDiv.style.backgroundImage = `url('${url}')`; };
            img.onerror = () => { cardDiv.style.backgroundImage = `url('https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=400&fit=crop')`; };
            img.src = url;

            if (isVotingPhase) {
                if (amINarrator || url === myPlayedCardUrl) {
                    cardDiv.classList.add('locked-card');
                    cardDiv.onclick = () => alert(amINarrator ? "Narrador não vota!" : "Não pode votar na própria carta!");
                } else {
                    cardDiv.onclick = () => openModal(url, 'VOTE');
                }
            } else {
                if (!amINarrator && !narratorHasPlayed) cardDiv.classList.add('locked-card');
                cardDiv.onclick = () => {
                    if (!amINarrator && !narratorHasPlayed) return alert("Aguarde o Narrador jogar a carta dele!");
                    openModal(url, 'PLAY');
                };
                myHandElements.push(cardDiv);
            }
            $('hand').appendChild(cardDiv);
        }

        socket.on('gameStarted', ({ players }) => {
            $('startBtn').style.display = 'none';$('hand').innerHTML = '';
            myHandElements = []; narratorHasPlayed = false; myPlayedCardUrl = '';
            
            const me = players.find(p => p.id === socket.id);
            if (!me) return;
            
            amINarrator = me.isNarrator;
            $('actionInstruction').innerHTML = amINarrator
                ? '<span style="color:#2ecc71;">Sua vez! Fale a dica em voz alta e escolha sua carta.</span>'
                : '<span style="color:#f1c40f;">Aguarde o Narrador dar a dica e jogar a carta.</span>';
                
            me.hand.forEach(url => appendCardToBoard(url, false));
        });

        socket.on('narratorPlayed', () => {
            narratorHasPlayed = true;
            if (!amINarrator) {
                $('actionInstruction').innerHTML = '<span style="color:#9b59b6;">O Narrador jogou! Escolha a sua carta para confundir os outros.</span>';
                myHandElements.forEach(d => d.classList.remove('locked-card'));
            }
        });

        socket.on('startVotingPhase', ({ cards }) => {
            $('hand').innerHTML = '';$('actionInstruction').innerHTML = amINarrator
                ? '<span style="color:#f1c40f;">Hora da votação. Aguarde os jogadores.</span>'
                : '<span style="color:#2ecc71;">Votação! Qual é a carta do narrador?</span>';
            cards.forEach(url => appendCardToBoard(url, true));
        });

        socket.on('roundEnded', ({ ranking, isGameOver, hostSocketId }) => {
            $('actionInstruction').innerHTML = isGameOver ? '🏆 Fim de Jogo!' : 'Fim da Rodada!';
            
            let html = `<table class="ranking-table"><tr><th>Pos.</th><th>Jogador</th><th>Pts</th></tr>`;
            ranking.forEach((p, i) => {
                const nar = p.isNarrator ? ' (Narrador)' : '';
                html += `<tr><td>${i + 1}º</td><td>${p.name}${nar}</td><td>${p.score}</td></tr>`;
            });
            html += `</table>`;
            
            if (socket.id === hostSocketId) {
                if (!isGameOver) html += `<button class="btn-yellow" onclick="nextRound()">Próxima Rodada</button>`;
                else html += `<button class="btn-green" style="margin-top:20px;" onclick="window.location.reload()">Jogar Novamente</button>`;
            }
            $('hand').innerHTML = html;
        });

        function openModal(url, action) {
            selectedCardUrl = url; modalAction = action; $('modalImage').src = url;
            $('btnConfirmModal').innerText = action === 'PLAY' ? 'Jogar esta carta' : 'Confirmar Voto';
            $('cardModal').style.display = 'block';
        }
        
        function closeModal() { $('cardModal').style.display = 'none'; selectedCardUrl = ''; }

        function handleConfirmModal() {
            if (!selectedCardUrl) return;
            if (modalAction === 'PLAY') {
                myPlayedCardUrl = selectedCardUrl;
                socket.emit('playCard', { roomId: myRoomId, cardUrl: selectedCardUrl });
                $('hand').innerHTML = '';$('actionInstruction').innerHTML = 'Carta jogada! Aguardando os outros...';
            } else {
                socket.emit('voteCard', { roomId: myRoomId, cardUrl: selectedCardUrl });
                $('hand').innerHTML = '';$('actionInstruction').innerHTML = 'Voto registrado! Aguardando apuração...';
            }
            closeModal();
        }
    </script>
</body>
</html>
