<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dixit Online - Gerador de Cartas</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background-color: #1e1e2f;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #f1c40f; }
    .controles { margin: 20px 0; }
    input {
      padding: 12px;
      width: 300px;
      border-radius: 5px;
      border: none;
      font-size: 16px;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #e74c3c;
      color: white;
      border: none;
      border-radius: 5px;
      transition: 0.3s;
    }
    button:hover { background-color: #c0392b; }
    button:disabled { background-color: #7f8c8d; cursor: wait; }
    #status { margin: 15px; font-style: italic; color: #bdc3c7; }
    #galeria {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 30px;
    }
    img {
      width: 200px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      animation: fadeIn 1s;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <h1>🎨 Fábrica de Cartas Dixit</h1>
  
  <div class="controles">
    <input type="text" id="cena" placeholder="Ex: um relógio derretendo no deserto">
    <button id="btn-gerar" onclick="pedirCarta()">Criar Carta</button>
  </div>

  <div id="status">Digite uma cena e clique em Criar Carta...</div>
  
  <div id="galeria"></div>

  <script>
    async function pedirCarta() {
      const btn = document.getElementById('btn-gerar');
      const status = document.getElementById('status');
      const input = document.getElementById('cena').value || 'a magical forest with glowing mushrooms';

      btn.disabled = true;
      status.style.color = '#f1c40f';
      status.innerText = 'A IA está pintando a sua carta... (Pode levar uns 15 segundos)';

      try {
        // Chama o nosso backend em Node.js
        const resposta = await fetch(`/api/gerar-carta?cena=${encodeURIComponent(input)}`);
        const dados = await resposta.json();

        if (dados.sucesso) {
          // Se deu certo, cria a imagem na tela
          const img = document.createElement('img');
          img.src = dados.url;
          
          // Adiciona a imagem nova no começo da galeria
          const galeria = document.getElementById('galeria');
          galeria.insertBefore(img, galeria.firstChild);
          
          status.style.color = '#2ecc71';
          status.innerText = 'Carta criada com sucesso!';
        } else {
          status.style.color = '#e74c3c';
          status.innerText = 'Erro: ' + dados.erro;
        }
      } catch (erro) {
        status.style.color = '#e74c3c';
        status.innerText = 'Falha na conexão com o servidor.';
      }

      btn.disabled = false;
    }
  </script>

</body>
</html>
