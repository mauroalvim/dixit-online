<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dixit Online</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #2c3e50; color: white; margin: 0; padding: 20px; }
        
        button { padding: 10px 15px; font-size: 16px; margin: 5px; cursor: pointer; border-radius: 5px; border: none; background: #3498db; color: white; font-weight: bold; }
        button:hover { background: #2980b9; }
        input { padding: 10px; font-size: 16px; margin: 5px; border-radius: 5px; border: 1px solid #ccc; }
        
        #hand { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
        .card { width: 100px; height: 150px; border-radius: 8px; cursor: pointer; object-fit: cover; border: 2px solid transparent; transition: 0.2s; }
        .card:hover { transform: scale(1.05); border-color: #f1c40f; }
        
        /* Modal de Zoom */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); }
        .modal-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #34495e; padding: 20px; border-radius: 10px; text-align: center; width: 90%; max-width: 400px; }
        .modal-img { width: 100%; max-height: 60vh; object-fit: contain; border-radius: 8px; margin-bottom: 15px; }
        .modal-buttons button { width: 100%; margin-bottom: 10px; }
        .btn-confirm { background: #2ecc71; }
        .btn-confirm:hover { background: #27ae60; }
        .btn-cancel { background: #e74c3c; }
        .btn-cancel:hover { background: #c0392b; }
    </style>
</head>
<body>
    <h1>Dixit Online</h1>
    
    <!-- TELA 1 -->
    <div id="initialMenu">
        <h3>Bem-vindo!</h3>
        <input type="text" id="globalPlayerName" placeholder="Digite seu Nome">
        <br><br>
        <button onclick="showCreateRoom()">Criar Nova Sala (Host)</button>
        <br><br>
        <button onclick="showJoinRoom()">Entrar em uma Sala Existente</button>
    </div>

    <!-- TELA 2 -->
    <div id="joinForm" style="display:none;">
        <h3>Entrar na Sala</h3>
        <input type="text" id="roomId" placeholder="Código da Sala">
        <br><br>
        <button onclick="joinRoom()">Entrar</button>
        <br><br>
        <button onclick="backToMenu()" class="btn-cancel">Voltar</button>
    </div>

    <!-- TELA 3 -->
    <div id="game" style="display:none;">
        <h2 id="roomCodeDisplay"></h2>
        
        <h3 id="waitingMessage" style="color: #f1c40f; display:none;">Aguardando outros jogadores entrarem...</h3>
        <!-- NOVA MENSAGEM DE CARREGAMENTO -->
        <h3 id="loadingMessage" style="color: #3498db; display:none;">Carregando cartas... Aguardando todos os jogadores.</h3>
        
        <div id="playersList">Nenhum jogador na sala ainda.</div>
        <br>
        <button id="startBtn" style="display:none;" onclick="startGame()">Iniciar Partida</button>
        <div id="hand"></div>
    </div>

    <!-- MODAL -->
    <div id="cardModal" class="modal">
        <div class="modal-content">
            <img id="modalImage" class="modal-img" src="">
            <div class="modal-buttons">
                <button class="btn-confirm" onclick="selectCard()">Confirmar Escolha</button>
                <button class="btn-cancel" onclick="closeModal()">Voltar</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myRoomId = '';
        let selectedCardUrl = '';
        
        // Novas variáveis globais para guardar o estado antes de exibir
        let myHandElements = [];
        let amINarrator = false;

        function showCreateRoom() {
            const name = document.getElementById('globalPlayerName').value;
            if(!name) return alert("Por favor, digite seu nome primeiro!");
            socket.emit('createRoom', { targetScore: 30, playerName: name });
        }

        function showJoinRoom() {
            const name = document.getElementById('globalPlayerName').value;
            if(!name) return alert("Por favor, digite seu nome primeiro antes de entrar em uma sala!");
            document.getElementById('initialMenu').style.display = 'none';
            document.getElementById('joinForm').style.display = 'block';
        }

        function backToMenu() {
            document.getElementById('joinForm').style.display = 'none';
            document.getElementById('initialMenu').style.display = 'block';
        }
        
        socket.on('roomCreated', ({ roomId, players }) => {
            myRoomId = roomId;
            document.getElementById('initialMenu').style.display = 'none';
            document.getElementById('joinForm').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            document.getElementById('roomCodeDisplay').innerText = 'Sua Sala: ' + roomId;
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('waitingMessage').style.display = 'block';
            updatePlayersList(players);
        });

        function joinRoom() {
            const room = document.getElementById('roomId').value.toUpperCase();
            const name = document.getElementById('globalPlayerName').value;
            if(!room) return alert("Por favor, preencha o código da sala!");
            socket.emit('joinRoom', { roomId: room, playerName: name });
        }

        socket.on('joinedSuccess', ({ roomId }) => {
            myRoomId = roomId;
            document.getElementById('initialMenu').style.display = 'none';
            document.getElementById('joinForm').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            document.getElementById('roomCodeDisplay').innerText = 'Conectado na Sala: ' + roomId;
            document.getElementById('waitingMessage').style.display = 'none'; 
        });

        socket.on('joinError', ({ message }) => alert(message));

        socket.on('playerJoined', ({ players }) => {
            updatePlayersList(players);
            if (players.length > 1) {
                document.getElementById('waitingMessage').style.display = 'none';
                if(document.getElementById('roomCodeDisplay').innerText.includes('Sua Sala:')) {
                    document.getElementById('startBtn').style.display = 'inline-block';
                }
            }
        });

        function updatePlayersList(players) {
            document.getElementById('playersList').innerText = 'Jogadores: ' + players.map(p => p.name).join(', ');
        }

        function startGame() {
            socket.emit('startGame', { roomId: myRoomId });
        }

        // FASE 1: Recebe o aviso de início e começa a baixar as cartas invisivelmente
        socket.on('gameStarted', ({ players }) => {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('waitingMessage').style.display = 'none';
            document.getElementById('hand').innerHTML = ''; 
            document.getElementById('loadingMessage').style.display = 'block'; // Mostra aviso de loading
            
            const me = players.find(p => p.id === socket.id);
            if(me) {
                amINarrator = me.isNarrator;
                myHandElements = [];
                let loadedCount = 0;
                const totalImages = me.hand.length;

                // Faz o pre-load das imagens no navegador
                me.hand.forEach(url => {
                    const img = new Image();
                    img.src = url;
                    img.className = 'card';
                    img.onclick = () => openModal(url);
                    
                    // Conta tanto em caso de sucesso quanto erro para não travar o jogo
                    img.onload = checkAllLoaded;
                    img.onerror = checkAllLoaded; 
                    
                    myHandElements.push(img);
                });

                function checkAllLoaded() {
                    loadedCount++;
                    if (loadedCount === totalImages) {
                        // Avisa o servidor que ESTE jogador está pronto
                        socket.emit('imagesLoaded', { roomId: myRoomId });
                    }
                }
            }
        });

        // FASE 2: Servidor avisa que TODOS baixaram as cartas
        socket.on('allClientsReady', () => {
            document.getElementById('loadingMessage').style.display = 'none';
            
            const handDiv = document.getElementById('hand');
            handDiv.innerHTML = '<h3>Sua Mão (Clique para ampliar):</h3>';
            
            myHandElements.forEach(img => {
                handDiv.appendChild(img);
            });

            // Só agora dispara o alerta
            if(amINarrator) {
                setTimeout(() => {
                    alert('Você é o narrador dessa rodada! Escolha uma carta e dê sua dica.');
                }, 150); // Timeout rápido só para garantir a renderização visual do HTML
            }
        });

        function openModal(url) {
            selectedCardUrl = url;
            document.getElementById('modalImage').src = url;
            document.getElementById('cardModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('cardModal').style.display = 'none';
            selectedCardUrl = '';
        }

        function selectCard() {
            if(!selectedCardUrl) return;
            socket.emit('playCard', { roomId: myRoomId, cardUrl: selectedCardUrl });
            alert('Carta confirmada!');
            closeModal();
            document.getElementById('hand').innerHTML = '<h3>Carta escolhida! Aguardando os outros jogadores...</h3>';
        }
    </script>
</body>
</html>
