<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Imagination - Dixit Online</title>
    <style>
        /* Estilos Globais e Fundo Estático */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?q=80&w=2071&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            width: 90%;
            max-width: 600px;
            margin-top: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1, h2, h3 { margin: 10px 0; }
        
        .destaque { color: #f1c40f; }
        .narrador-texto { color: #2ecc71; font-weight: bold; font-size: 1.2rem; margin-bottom: 5px; }

        .info-mesa {
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .deck {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .carta {
            width: 100px;
            height: 150px;
            border-radius: 10px;
            object-fit: cover;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            border: 2px solid transparent;
        }

        .carta:hover {
            transform: scale(1.05);
            border: 2px solid #f1c40f;
        }

        .btn-acao {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            margin-top: 20px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        .versao {
            margin-top: 20px;
            color: #888;
            font-size: 0.9rem;
        }

        /* --- Estilos do Novo Modal Carrossel (Versão 10.35) --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 15, 20, 0.95); /* Fundo um pouco mais escuro para focar na arte */
        }
        
        .modal:not(.hidden) {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 101;
        }

        .carousel-container {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            height: 65vh;
            touch-action: pan-y; /* Previne scroll nativo durante o swipe horizontal */
        }

        .modal-content {
            max-width: 90%;
            max-height: 100%;
            border-radius: 15px;
            object-fit: contain;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            transition: opacity 0.2s ease-in-out;
        }

        .carousel-nav {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            font-size: 2rem;
            padding: 15px 10px;
            cursor: pointer;
            position: absolute;
            z-index: 10;
            border-radius: 8px;
            transition: 0.3s;
        }

        .carousel-nav:active { background: rgba(0, 0, 0, 0.9); }
        #prevBtn { left: 10px; }
        #nextBtn { right: 10px; }

        .zoom-action-container {
            text-align: center;
            margin-top: 20px;
        }

        #btnEscolherCarta {
            background-color: #2ecc71;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }

        #btnEscolherCarta:active { transform: scale(0.95); }

        /* Telas de Entrada */
        #loginScreen {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        input {
            padding: 12px;
            border-radius: 5px;
            border: none;
            font-size: 1rem;
            text-align: center;
        }
        button.primario {
            background: #f1c40f;
            color: #111;
            font-weight: bold;
            padding: 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <!-- Tela de Entrada -->
    <div class="container" id="telaEntrada">
        <h1 class="destaque">✨ Imagination ✨</h1>
        <p>Um jogo de cartas surreal online.</p>
        <div id="loginScreen">
            <input type="text" id="nomeJogador" placeholder="Seu Nome de Jogador">
            <input type="text" id="codigoSala" placeholder="Código da Sala (Ex: 3040)">
            <button class="primario" onclick="entrarNaSala()">Entrar na Sala</button>
        </div>
    </div>

    <!-- Tela do Jogo -->
    <div class="container" id="telaJogo" style="display: none;">
        <h2 class="destaque">Código da Sala: <span id="displayCodigo"></span></h2>
        
        <div class="info-mesa">
            <strong>Na Mesa:</strong> <span id="displayJogadores"></span>
        </div>

        <div id="statusNarrador" style="margin-bottom: 20px;">
            <!-- Preenchido dinamicamente via JS -->
        </div>

        <div class="deck" id="deckCartas">
            <!-- Cartas inseridas dinamicamente via JS -->
        </div>

        <button class="btn-acao" onclick="recarregarCartas()">🔄 Recarregar Cartas na Tela</button>
        
        <div class="versao">Versão 10.35 (100% Seguro)</div>
    </div>

    <!-- Modal de Visualização (O Novo Carrossel) -->
    <div id="zoomModal" class="modal hidden">
        <span class="close" onclick="fecharModal()">&times;</span>
        <div class="carousel-container">
            <button id="prevBtn" class="carousel-nav" onclick="navegarCarrossel(-1)">&#10094;</button>
            <img id="imgZoom" class="modal-content" src="" alt="Carta em Destaque">
            <button id="nextBtn" class="carousel-nav" onclick="navegarCarrossel(1)">&#10095;</button>
        </div>
        <div class="zoom-action-container">
            <button id="btnEscolherCarta" onclick="confirmarCartaDoZoom()">🌟 Escolher esta Carta</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let meuId = null;
        let codigoAtual = null;
        
        // --- Variáveis Globais de Estado do Jogo e Carrossel ---
        let cartasNoDeckAtual = []; 
        let indiceCarrosselAtual = 0;

        function entrarNaSala() {
            const nome = document.getElementById('nomeJogador').value;
            const codigo = document.getElementById('codigoSala').value;
            if(!nome || !codigo) {
                alert("Por favor, preencha o seu nome e o código da sala.");
                return;
            }
            
            codigoAtual = codigo;
            socket.emit('entrarSala', { nome, codigo });
            
            document.getElementById('telaEntrada').style.display = 'none';
            document.getElementById('telaJogo').style.display = 'block';
            document.getElementById('displayCodigo').innerText = codigo;
        }

        socket.on('atualizarSala', (sala) => {
            const eu = sala.jogadores.find(j => j.id === socket.id);
            if(!eu) return;

            // Atualiza jogadores conectados na mesa
            const nomesMesa = sala.jogadores.map(j => j.nome).join(', ');
            document.getElementById('displayJogadores').innerText = nomesMesa;

            // Define UI do Narrador
            const souNarrador = sala.jogadores.findIndex(j => j.id === socket.id) === sala.narradorIndex;
            const statusDiv = document.getElementById('statusNarrador');
            
            if (souNarrador) {
                statusDiv.innerHTML = `
                    <div class="narrador-texto">Você é o Narrador!</div>
                    <div style="font-size: 0.95rem;">Fale a sua dica em voz alta e escolha uma carta.</div>
                `;
            } else {
                statusDiv.innerHTML = `<div style="font-size: 1.1rem; color: #f39c12;">Aguardando o Narrador falar a dica...</div>`;
            }

            // Atualiza o Deck local e desenha as cartas
            cartasNoDeckAtual = eu.mao;
            renderizarDeck();
        });

        function renderizarDeck() {
            const deckDiv = document.getElementById('deckCartas');
            deckDiv.innerHTML = '';
            
            cartasNoDeckAtual.forEach((cartaUrl, index) => {
                const img = document.createElement('img');
                img.src = cartaUrl;
                img.className = 'carta';
                
                // O clique agora abre o Zoom interativo, em vez de jogar direto
                img.onclick = () => abrirZoom(index);
                deckDiv.appendChild(img);
            });
        }

        function recarregarCartas() {
            renderizarDeck();
        }

        // ==========================================
        //  LÓGICA DO CARROSSEL E SELEÇÃO DE CARTAS
        // ==========================================

        function abrirZoom(indiceDaCartaClicada) {
            indiceCarrosselAtual = indiceDaCartaClicada;
            atualizarImagemCarrossel();
            document.getElementById('zoomModal').classList.remove('hidden');
        }

        function fecharModal() {
            document.getElementById('zoomModal').classList.add('hidden');
        }

        function atualizarImagemCarrossel() {
            const imgZoom = document.getElementById('imgZoom');
            
            // Efeito de fade suave ao trocar a imagem
            imgZoom.style.opacity = '0.5';
            setTimeout(() => {
                imgZoom.src = cartasNoDeckAtual[indiceCarrosselAtual];
                imgZoom.style.opacity = '1';
            }, 100);
            
            // Oculta setas se estiver nos limites da mão
            document.getElementById('prevBtn').style.display = (indiceCarrosselAtual === 0) ? 'none' : 'block';
            document.getElementById('nextBtn').style.display = (indiceCarrosselAtual === cartasNoDeckAtual.length - 1) ? 'none' : 'block';
        }

        function navegarCarrossel(direcao) {
            indiceCarrosselAtual += direcao;
            // Prevenção de estouro de array
            if (indiceCarrosselAtual < 0) indiceCarrosselAtual = 0;
            if (indiceCarrosselAtual >= cartasNoDeckAtual.length) indiceCarrosselAtual = cartasNoDeckAtual.length - 1;
            
            atualizarImagemCarrossel();
        }

        function confirmarCartaDoZoom() {
            const cartaSelecionadaUrl = cartasNoDeckAtual[indiceCarrosselAtual];
            fecharModal();
            // Dispara o evento original enviando a carta para a mesa no Backend
            socket.emit('jogarCarta', { codigo: codigoAtual, cartaUrl: cartaSelecionadaUrl });
        }

        // --- Suporte a "Swipe" (Arrastar imagem com o dedo no celular) ---
        let toqueInicialX = 0;
        let toqueFinalX = 0;
        const areaZoom = document.getElementById('imgZoom');

        areaZoom.addEventListener('touchstart', (e) => {
            toqueInicialX = e.changedTouches[0].screenX;
        });

        areaZoom.addEventListener('touchend', (e) => {
            toqueFinalX = e.changedTouches[0].screenX;
            processarSwipe();
        });

        function processarSwipe() {
            const limiteSwipe = 40; // Distância mínima sensível ao toque
            if (toqueFinalX < toqueInicialX - limiteSwipe) {
                navegarCarrossel(1); // Deslizou para a esquerda -> Mostra Próxima
            }
            if (toqueFinalX > toqueInicialX + limiteSwipe) {
                navegarCarrossel(-1); // Deslizou para a direita -> Mostra Anterior
            }
        }
    </script>
</body>
</html>
