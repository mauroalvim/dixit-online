<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Imagination - Dixit Online</title>
    <style>
        /* Estilos Globais e Fundo Elegante (Estilo v3.30+) */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            background-attachment: fixed;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Glassmorphism Cards */
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px 20px;
            width: 90%;
            max-width: 500px;
            margin-top: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            background: -webkit-linear-gradient(#f1c40f, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 10px rgba(241, 196, 15, 0.3);
        }

        p.subtitle {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        /* Tela de Entrada Refinada */
        #loginScreen {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        input {
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: border 0.3s;
        }

        input:focus {
            border: 1px solid #f1c40f;
            background: rgba(0, 0, 0, 0.4);
        }

        input::placeholder { color: #888; }

        button.primario {
            background: linear-gradient(135deg, #f1c40f, #e67e22);
            color: #111;
            font-weight: bold;
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button.primario:active {
            transform: scale(0.97);
            box-shadow: 0 2px 10px rgba(241, 196, 15, 0.4);
        }

        /* Tela de Jogo */
        .destaque { color: #f1c40f; font-size: 1.5rem; margin-bottom: 15px;}
        .narrador-texto { color: #2ecc71; font-weight: bold; font-size: 1.3rem; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;}

        .info-mesa {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 1.1rem;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .deck {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .carta {
            width: 110px;
            height: 160px;
            border-radius: 12px;
            object-fit: cover;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.6);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }

        .carta:hover {
            transform: translateY(-5px) scale(1.05);
            border: 2px solid #f1c40f;
            box-shadow: 0 10px 20px rgba(241, 196, 15, 0.3);
        }

        .btn-acao {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #ddd;
            padding: 12px 20px;
            border-radius: 20px;
            margin-top: 25px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-acao:hover { background: rgba(255, 255, 255, 0.2); }

        .versao { margin-top: 20px; color: #666; font-size: 0.9rem; }

        /* --- Modal Carrossel --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(5px);
        }
        
        .modal:not(.hidden) {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1010;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .carousel-container {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            height: 65vh;
            touch-action: pan-y;
        }

        .modal-content {
            max-width: 90%;
            max-height: 100%;
            border-radius: 15px;
            object-fit: contain;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transition: opacity 0.2s ease-in-out;
        }

        .carousel-nav {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 2rem;
            padding: 15px 12px;
            cursor: pointer;
            position: absolute;
            z-index: 10;
            border-radius: 50%;
            transition: 0.3s;
        }

        .carousel-nav:active { background: rgba(255, 255, 255, 0.3); }
        #prevBtn { left: 15px; }
        #nextBtn { right: 15px; }

        .zoom-action-container { text-align: center; margin-top: 30px; }

        #btnEscolherCarta {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
            transition: transform 0.2s;
        }

        #btnEscolherCarta:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <!-- Tela de Entrada -->
    <div class="container" id="telaEntrada">
        <h1>✨ Imagination ✨</h1>
        <p class="subtitle">Um jogo de cartas surreal online.</p>
        <div id="loginScreen">
            <input type="text" id="nomeJogador" placeholder="Seu Nome de Jogador">
            <input type="number" id="codigoSala" placeholder="Código da Sala (Ex: 3040)">
            <button class="primario" onclick="entrarNaSala()">Entrar na Sala</button>
        </div>
    </div>

    <!-- Tela do Jogo -->
    <div class="container" id="telaJogo" style="display: none;">
        <h2 class="destaque">Código da Sala: <span id="displayCodigo"></span></h2>
        
        <div class="info-mesa">
            <span style="color:#aaa;">Na Mesa:</span> <strong id="displayJogadores"></strong>
        </div>

        <div id="statusNarrador" style="margin-bottom: 20px;">
            <!-- Preenchido dinamicamente via JS -->
        </div>

        <div class="deck" id="deckCartas">
            <!-- Cartas inseridas dinamicamente via JS -->
        </div>

        <button class="btn-acao" onclick="recarregarCartas()">🔄 Recarregar Cartas na Tela</button>
        
        <div class="versao">Versão 10.35 (Interface Premium + Carrossel)</div>
    </div>

    <!-- Modal de Visualização (Carrossel Interativo) -->
    <div id="zoomModal" class="modal hidden">
        <span class="close" onclick="fecharModal()">&times;</span>
        <div class="carousel-container">
            <button id="prevBtn" class="carousel-nav" onclick="navegarCarrossel(-1)">&#10094;</button>
            <img id="imgZoom" class="modal-content" src="" alt="Carta em Destaque">
            <button id="nextBtn" class="carousel-nav" onclick="navegarCarrossel(1)">&#10095;</button>
        </div>
        <div class="zoom-action-container">
            <button id="btnEscolherCarta" onclick="confirmarCartaDoZoom()">🌟 Escolher esta Carta</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let meuId = null;
        let codigoAtual = null;
        
        // Estado do Carrossel
        let cartasNoDeckAtual = []; 
        let indiceCarrosselAtual = 0;

        function entrarNaSala() {
            const nome = document.getElementById('nomeJogador').value;
            const codigo = document.getElementById('codigoSala').value;
            if(!nome || !codigo) {
                alert("Por favor, preencha o seu nome e o código numérico da sala.");
                return;
            }
            
            codigoAtual = codigo;
            socket.emit('entrarSala', { nome, codigo });
            
            document.getElementById('telaEntrada').style.display = 'none';
            document.getElementById('telaJogo').style.display = 'block';
            document.getElementById('displayCodigo').innerText = codigo;
        }

        socket.on('atualizarSala', (sala) => {
            const eu = sala.jogadores.find(j => j.id === socket.id);
            if(!eu) return;

            const nomesMesa = sala.jogadores.map(j => j.nome).join(', ');
            document.getElementById('displayJogadores').innerText = nomesMesa;

            const souNarrador = sala.jogadores.findIndex(j => j.id === socket.id) === sala.narradorIndex;
            const statusDiv = document.getElementById('statusNarrador');
            
            if (souNarrador) {
                statusDiv.innerHTML = `
                    <div class="narrador-texto">Você é o Narrador!</div>
                    <div style="font-size: 0.95rem; color: #ccc;">Fale a sua dica em voz alta e escolha uma carta.</div>
                `;
            } else {
                statusDiv.innerHTML = `<div style="font-size: 1.1rem; color: #f39c12; font-weight: bold;">Aguardando o Narrador falar a dica...</div>`;
            }

            cartasNoDeckAtual = eu.mao;
            renderizarDeck();
        });

        function renderizarDeck() {
            const deckDiv = document.getElementById('deckCartas');
            deckDiv.innerHTML = '';
            
            cartasNoDeckAtual.forEach((cartaUrl, index) => {
                const img = document.createElement('img');
                img.src = cartaUrl;
                img.className = 'carta';
                img.onclick = () => abrirZoom(index);
                deckDiv.appendChild(img);
            });
        }

        function recarregarCartas() {
            renderizarDeck();
        }

        // --- Lógica do Carrossel e Swipe ---

        function abrirZoom(indiceDaCartaClicada) {
            indiceCarrosselAtual = indiceDaCartaClicada;
            atualizarImagemCarrossel();
            document.getElementById('zoomModal').classList.remove('hidden');
        }

        function fecharModal() {
            document.getElementById('zoomModal').classList.add('hidden');
        }

        function atualizarImagemCarrossel() {
            const imgZoom = document.getElementById('imgZoom');
            
            imgZoom.style.opacity = '0.3';
            setTimeout(() => {
                imgZoom.src = cartasNoDeckAtual[indiceCarrosselAtual];
                imgZoom.style.opacity = '1';
            }, 100);
            
            document.getElementById('prevBtn').style.display = (indiceCarrosselAtual === 0) ? 'none' : 'block';
            document.getElementById('nextBtn').style.display = (indiceCarrosselAtual === cartasNoDeckAtual.length - 1) ? 'none' : 'block';
        }

        function navegarCarrossel(direcao) {
            indiceCarrosselAtual += direcao;
            if (indiceCarrosselAtual < 0) indiceCarrosselAtual = 0;
            if (indiceCarrosselAtual >= cartasNoDeckAtual.length) indiceCarrosselAtual = cartasNoDeckAtual.length - 1;
            atualizarImagemCarrossel();
        }

        function confirmarCartaDoZoom() {
            const cartaSelecionadaUrl = cartasNoDeckAtual[indiceCarrosselAtual];
            fecharModal();
            socket.emit('jogarCarta', { codigo: codigoAtual, cartaUrl: cartaSelecionadaUrl });
        }

        // Eventos de Toque (Swipe)
        let toqueInicialX = 0;
        let toqueFinalX = 0;
        const areaZoom = document.getElementById('imgZoom');

        areaZoom.addEventListener('touchstart', (e) => {
            toqueInicialX = e.changedTouches[0].screenX;
        });

        areaZoom.addEventListener('touchend', (e) => {
            toqueFinalX = e.changedTouches[0].screenX;
            processarSwipe();
        });

        function processarSwipe() {
            const limiteSwipe = 40;
            if (toqueFinalX < toqueInicialX - limiteSwipe) {
                navegarCarrossel(1);
            }
            if (toqueFinalX > toqueInicialX + limiteSwipe) {
                navegarCarrossel(-1);
            }
        }
    </script>
</body>
</html>
