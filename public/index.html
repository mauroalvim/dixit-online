<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dixit Online</title>
    <!-- Fonte Moderna do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Fundo Animado e Corpo */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        body { 
            font-family: 'Poppins', sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1a2a6c);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white; 
        }
        
        /* Design Glassmorphism (Painéis de Vidro) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            margin: 20px auto;
            max-width: 600px;
        }

        h1 { font-weight: 800; font-size: 2.5em; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin-bottom: 10px; }
        h3 { font-weight: 600; }

        /* Botões Modernos */
        button { 
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white; 
            border: none; 
            border-radius: 25px; 
            padding: 12px 24px; 
            font-size: 16px; 
            font-weight: 600;
            margin: 10px 5px; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .btn-cancel { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        .btn-confirm { background: linear-gradient(135deg, #11998e, #38ef7d); }

        /* Inputs Modernos */
        input { 
            padding: 12px; 
            font-size: 16px; 
            border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.3); 
            background: rgba(255,255,255,0.1);
            color: white;
            text-align: center; 
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: 0.3s;
        }
        input::placeholder { color: rgba(255,255,255,0.6); }
        input:focus { background: rgba(255,255,255,0.2); border-color: #6e8efb; }
        
        /* Cartas */
        #hand { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-top: 20px; }
        .card { 
            width: 110px; 
            height: 165px; 
            border-radius: 12px; 
            cursor: pointer; 
            object-fit: cover; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border: 3px solid transparent; 
            transition: 0.3s; 
        }
        .card:hover { transform: scale(1.08) translateY(-5px); border-color: #a777e3; }
        .my-card-disabled { opacity: 0.4; cursor: not-allowed; border-color: #ff4b2b !important; transform: none !important; }
        .narrator-card-view { cursor: default; }
        .narrator-card-view:hover { transform: none; border-color: transparent; }
        
        /* Tabela de Ranking Chamativa */
        .ranking-table { 
            margin: 20px auto; 
            border-collapse: collapse; 
            width: 100%; 
            background: rgba(0,0,0,0.4); 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .ranking-table th, .ranking-table td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .ranking-table th { background: linear-gradient(135deg, #a777e3, #6e8efb); color: white; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;}
        .ranking-table tr:hover { background: rgba(255,255,255,0.1); }
        
        /* Título de Vitória Animado */
        .winner-title {
            font-size: 2.2em;
            color: #ffd700;
            text-shadow: 0 0 10px #ffaa00, 0 0 20px #ffaa00;
            animation: pulse 1.5s infinite;
            margin: 20px 0;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        /* Modal */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); backdrop-filter: blur(5px); }
        .modal-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a2a6c; padding: 25px; border-radius: 15px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.1); }
        .modal-img { width: 100%; max-height: 55vh; object-fit: contain; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .modal-buttons button { width: 100%; margin-bottom: 10px; font-size: 18px; padding: 15px; }
    </style>
</head>
<body>
    <h1>Dixit Online ✨</h1>
    
    <div id="initialMenu" class="glass-panel">
        <h3>Bem-vindo!</h3>
        <input type="text" id="globalPlayerName" placeholder="Digite seu Nome">
        <br><br>
        <div style="background: rgba(0,0,0,0.2); padding: 20px; border-radius: 12px; margin-bottom: 15px;">
            <h4 style="margin-top:0;">👑 Para o Host:</h4>
            <label style="font-size: 14px; opacity: 0.8;">Pontos para Vencer:</label><br>
            <input type="number" id="targetScoreInput" value="30" style="width: 80px; margin-top: 5px;">
            <br>
            <button onclick="showCreateRoom()">Criar Nova Sala</button>
        </div>
        <div style="background: rgba(0,0,0,0.2); padding: 20px; border-radius: 12px;">
            <h4 style="margin-top:0;">🎮 Para Convidados:</h4>
            <button onclick="showJoinRoom()">Entrar em uma Sala Existente</button>
        </div>
    </div>

    <div id="joinForm" class="glass-panel" style="display:none;">
        <h3>Entrar na Sala</h3>
        <input type="text" id="roomId" placeholder="Código da Sala">
        <br><br>
        <button onclick="joinRoom()">Entrar</button>
        <br><br>
        <button onclick="backToMenu()" class="btn-cancel">Voltar</button>
    </div>

    <div id="game" class="glass-panel" style="display:none; max-width: 800px;">
        <h2 id="roomCodeDisplay" style="color: #a777e3;"></h2>
        
        <h3 id="waitingMessage" style="color: #f1c40f; display:none;">Aguardando outros jogadores entrarem...</h3>
        <h3 id="loadingMessage" style="color: #38ef7d; display:none;">🪄 Criando cartas mágicas... Aguarde!</h3>
        
        <div id="playersList" style="opacity: 0.8; margin-bottom: 15px;">Nenhum jogador na sala ainda.</div>
        <button id="startBtn" style="display:none; width: 100%; font-size: 18px;" onclick="startGame()">Iniciar Partida</button>
        
        <div id="hand"></div>
    </div>

    <div id="cardModal" class="modal">
        <div class="modal-content">
            <img id="modalImage" class="modal-img" src="">
            <div class="modal-buttons">
                <button id="btnConfirmModal" class="btn-confirm" onclick="handleConfirmModal()">Confirmar Escolha</button>
                <button class="btn-cancel" onclick="closeModal()">Voltar</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myRoomId = '';
        let selectedCardUrl = '';
        let myPlayedCardUrl = ''; 
        let modalAction = 'PLAY'; 
        
        let myHandElements = [];
        let amINarrator = false;

        function showCreateRoom() {
            const name = document.getElementById('globalPlayerName').value;
            const targetScore = document.getElementById('targetScoreInput').value;
            if(!name) return alert("Por favor, digite seu nome primeiro!");
            socket.emit('createRoom', { targetScore: targetScore, playerName: name });
        }

        function showJoinRoom() {
            const name = document.getElementById('globalPlayerName').value;
            if(!name) return alert("Por favor, digite seu nome primeiro!");
            document.getElementById('initialMenu').style.display = 'none';
            document.getElementById('joinForm').style.display = 'block';
        }

        function backToMenu() {
            document.getElementById('joinForm').style.display = 'none';
            document.getElementById('initialMenu').style.display = 'block';
        }
        
        socket.on('roomCreated', ({ roomId, players }) => {
            myRoomId = roomId;
            document.getElementById('initialMenu').style.display = 'none';
            document.getElementById('joinForm').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            document.getElementById('roomCodeDisplay').innerText = 'Sua Sala: ' + roomId;
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('waitingMessage').style.display = 'block';
            updatePlayersList(players);
        });

        function joinRoom() {
            const room = document.getElementById('roomId').value.toUpperCase();
            const name = document.getElementById('globalPlayerName').value;
            if(!room) return alert("Por favor, preencha o código da sala!");
            socket.emit('joinRoom', { roomId: room, playerName: name });
        }

        socket.on('joinedSuccess', ({ roomId }) => {
            myRoomId = roomId;
            document.getElementById('initialMenu').style.display = 'none';
            document.getElementById('joinForm').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            document.getElementById('roomCodeDisplay').innerText = 'Conectado na Sala: ' + roomId;
            document.getElementById('waitingMessage').style.display = 'none'; 
        });

        socket.on('joinError', ({ message }) => alert(message));

        socket.on('playerJoined', ({ players }) => {
            updatePlayersList(players);
            if (players.length > 1) {
                document.getElementById('waitingMessage').style.display = 'none';
                if(document.getElementById('roomCodeDisplay').innerText.includes('Sua Sala:')) {
                    document.getElementById('startBtn').style.display = 'inline-block';
                }
            }
        });

        function updatePlayersList(players) {
            document.getElementById('playersList').innerText = 'Jogadores na mesa: ' + players.map(p => p.name).join(', ');
        }

        function startGame() { socket.emit('startGame', { roomId: myRoomId }); }
        function nextRound() { socket.emit('nextRound', { roomId: myRoomId }); }

        socket.on('gameStarted', ({ players }) => {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('waitingMessage').style.display = 'none';
            document.getElementById('hand').innerHTML = ''; 
            document.getElementById('loadingMessage').style.display = 'block'; 
            
            const me = players.find(p => p.id === socket.id);
            if(me) {
                amINarrator = me.isNarrator;
                myPlayedCardUrl = ''; 
                myHandElements = [];
                let loadedCount = 0;
                const totalImages = me.hand.length;

                me.hand.forEach(url => {
                    const img = new Image();
                    img.src = url;
                    img.className = 'card';
                    img.onclick = () => openModal(url, 'PLAY'); 
                    img.onload = checkAllLoaded;
                    img.onerror = checkAllLoaded; 
                    myHandElements.push(img);
                });

                function checkAllLoaded() {
                    loadedCount++;
                    if (loadedCount === totalImages) {
                        socket.emit('imagesLoaded', { roomId: myRoomId });
                    }
                }
            }
        });

        socket.on('allClientsReady', () => {
            document.getElementById('loadingMessage').style.display = 'none';
            const handDiv = document.getElementById('hand');
            
            if(amINarrator) {
                handDiv.innerHTML = '<h3 style="color:#38ef7d; font-size: 1.5em; text-shadow: 0 0 10px rgba(56,239,125,0.5);">VOCÊ É O NARRADOR!</h3><p>Escolha uma carta abaixo e dê sua dica em voz alta para os jogadores.</p>';
            } else {
                handDiv.innerHTML = '<h3>Sua Mão (Escolha uma carta para jogar):</h3>';
            }
            
            const cardsContainer = document.createElement('div');
            cardsContainer.style.display = 'flex';
            cardsContainer.style.flexWrap = 'wrap';
            cardsContainer.style.justifyContent = 'center';
            cardsContainer.style.gap = '15px';

            myHandElements.forEach(img => cardsContainer.appendChild(img));
            handDiv.appendChild(cardsContainer);
        });

        socket.on('startVotingPhase', ({ cards }) => {
            const handDiv = document.getElementById('hand');
            
            if (amINarrator) {
                handDiv.innerHTML = '<h3 style="color:#f1c40f;">As cartas foram reveladas!</h3><p>Aguarde os jogadores votarem. Você não vota.</p>';
            } else {
                handDiv.innerHTML = '<h3 style="color:#a777e3;">Fase de Votação</h3><p>Qual destas cartas você acha que é a do narrador?</p>';
            }

            const cardsContainer = document.createElement('div');
            cardsContainer.style.display = 'flex';
            cardsContainer.style.flexWrap = 'wrap';
            cardsContainer.style.justifyContent = 'center';
            cardsContainer.style.gap = '15px';

            cards.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                img.className = 'card';
                
                // TRAVA VISUAL PARA O NARRADOR NA TELA DE VOTAÇÃO
                if (amINarrator) {
                    img.classList.add('narrator-card-view');
                    img.onclick = () => alert("Você é o narrador! Apenas observe os outros jogadores votarem.");
                } 
                // TRAVA VISUAL PARA O JOGADOR NÃO VOTAR NA PRÓPRIA CARTA
                else if (url === myPlayedCardUrl) {
                    img.classList.add('my-card-disabled');
                    img.onclick = () => alert("Você não pode votar na carta que você mesmo jogou!");
                } 
                else {
                    img.onclick = () => openModal(url, 'VOTE');
                }
                cardsContainer.appendChild(img);
            });
            handDiv.appendChild(cardsContainer);
        });

        socket.on('roundEnded', ({ ranking, isGameOver, targetScore, hostSocketId }) => {
            let html = `<h3 style="font-size: 1.8em; color: #a777e3;">Fim da Rodada!</h3>`;
            
            if (isGameOver) {
                const vencedor = ranking[0].name;
                html += `<div class="winner-title">🏆 ${vencedor} VENCEU O JOGO! 🏆</div>`;
            } else {
                html += `<p style="opacity: 0.8;">A partida vai até <strong>${targetScore}</strong> pontos.</p>`;
            }

            html += `
                <table class="ranking-table">
                    <tr>
                        <th>Pos.</th>
                        <th>Jogador</th>
                        <th>Pontos</th>
                    </tr>
            `;

            ranking.forEach((p, index) => {
                // Destaca o primeiro lugar em dourado
                let rowStyle = (index === 0) ? 'color: #f1c40f; font-weight: bold;' : '';
                let narratorTag = p.isNarrator ? '<span style="font-size:12px; color:#38ef7d;">(Narrador)</span>' : '';
                
                html += `
                    <tr style="${rowStyle}">
                        <td style="font-size:1.2em;">${index + 1}º</td>
                        <td>${p.name} <br> ${narratorTag}</td>
                        <td style="font-size:1.5em;">${p.score}</td>
                    </tr>
                `;
            });

            html += `</table>`;

            if (!isGameOver && socket.id === hostSocketId) {
                html += `<button onclick="nextRound()" style="background: linear-gradient(135deg, #f1c40f, #e67e22); color:#fff; width:100%; font-size:18px;">Começar Próxima Rodada</button>`;
            } else if (!isGameOver) {
                html += `<p style="color: #38ef7d; font-style: italic;">Aguardando o Host iniciar a próxima rodada...</p>`;
            } else if (isGameOver && socket.id === hostSocketId) {
                // Se acabou o jogo, o Host tem a opção de recriar a sala. Recarregar a página é o jeito mais limpo.
                html += `<button onclick="window.location.reload()" style="background: linear-gradient(135deg, #11998e, #38ef7d); color:#fff; width:100%;">Jogar Novamente (Nova Sala)</button>`;
            }

            document.getElementById('hand').innerHTML = html;
        });

        function openModal(url, action) {
            selectedCardUrl = url;
            modalAction = action;
            document.getElementById('modalImage').src = url;
            
            const btnConfirm = document.getElementById('btnConfirmModal');
            if (action === 'PLAY') {
                btnConfirm.innerText = 'Confirmar Escolha';
                btnConfirm.style.background = 'linear-gradient(135deg, #11998e, #38ef7d)';
            } else if (action === 'VOTE') {
                btnConfirm.innerText = 'Confirmar Voto';
                btnConfirm.style.background = 'linear-gradient(135deg, #a777e3, #6e8efb)'; 
            }
            document.getElementById('cardModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('cardModal').style.display = 'none';
            selectedCardUrl = '';
        }

        function handleConfirmModal() {
            if(!selectedCardUrl) return;
            
            if (modalAction === 'PLAY') {
                myPlayedCardUrl = selectedCardUrl; 
                socket.emit('playCard', { roomId: myRoomId, cardUrl: selectedCardUrl });
                document.getElementById('hand').innerHTML = '<h3 style="color: #38ef7d;">Carta na mesa!</h3><p>Aguardando os outros jogadores...</p>';
            } else if (modalAction === 'VOTE') {
                socket.emit('voteCard', { roomId: myRoomId, cardUrl: selectedCardUrl });
                document.getElementById('hand').innerHTML = '<h3 style="color: #6e8efb;">Voto registrado!</h3><p>Aguardando apuração...</p>';
            }
            closeModal();
        }
    </script>
</body>
</html>
