<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Imagination</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-hover: #059669;
            --text-main: #f8fafc;
            --gold-glow: 0 0 20px rgba(250, 204, 21, 0.8);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        /* Fundo imersivo com imagem surreal */
        body { 
            color: var(--text-main); 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
            background-image: url('https://cdn.pixabay.com/photo/2021/09/13/08/19/fantasy-6620584_1280.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        /* Camada de desfoque (Glassmorphism global) */
        .bg-blur {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            backdrop-filter: blur(25px) brightness(0.6);
            -webkit-backdrop-filter: blur(25px) brightness(0.6);
            z-index: -1;
        }
        
        .screen {
            display: none; flex-direction: column; height: 100%; padding: 20px;
        }
        .screen.active { display: flex; }

        /* Painel de Vidro para Login e Lobby */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { font-size: 32px; font-weight: 800; margin-bottom: 5px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .subtitle { text-align: center; color: #cbd5e1; font-size: 14px; margin-bottom: 25px; }

        /* Inputs e Botões com estilo translúcido */
        input {
            width: 100%; padding: 15px; border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2); color: white; 
            margin-bottom: 15px; font-size: 16px;
            outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); background: rgba(0, 0, 0, 0.4); }
        input::placeholder { color: #94a3b8; }

        button {
            width: 100%; padding: 15px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600;
            background: var(--primary); color: white; cursor: pointer; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); margin-bottom: 10px;
        }
        button:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-2px); }
        button:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.4); cursor: not-allowed; box-shadow: none; border: 1px solid rgba(255,255,255,0.1); }
        
        .btn-secondary { background: rgba(59, 130, 246, 0.8); box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        .btn-secondary:hover { background: rgba(37, 99, 235, 1); }

        /* Grid de Cartas com Scroll Horizontal Estilo Carrossel */
        .cards-container {
            display: flex; gap: 15px; overflow-x: auto; padding: 20px 0;
            scroll-snap-type: x mandatory; scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            flex-grow: 1; align-items: center;
        }
        .cards-container::-webkit-scrollbar { display: none; }
        
        .carta {
            flex: 0 0 75%; max-width: 320px; height: 60vh; border-radius: 16px;
            scroll-snap-align: center; position: relative;
            background-size: cover; background-position: center;
            border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            transition: transform 0.3s ease;
        }
        
        /* Destaques Especiais */
        .carta-narrador { border: 3px solid #facc15; box-shadow: var(--gold-glow); }
        
        /* Detalhes nos Resultados */
        .carta-info {
            position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.75);
            padding: 12px; border-bottom-left-radius: 15px; border-bottom-right-radius: 15px;
            text-align: center; backdrop-filter: blur(8px);
        }
        .dono-texto { font-weight: 800; color: #38bdf8; font-size: 15px; }
        .dono-texto.dono-narrador { color: #facc15; }
        .votos-texto { font-size: 13px; color: #e2e8f0; margin-top: 4px; }

        /* Ranking List */
        .ranking-list {
            background: rgba(0,0,0,0.2); border-radius: 12px; padding: 15px;
            border: 1px solid rgba(255,255,255,0.1); width: 100%;
            max-height: 200px; overflow-y: auto;
        }
        .ranking-item {
            display: flex; justify-content: space-between; padding: 12px; 
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 16px; font-weight: 600;
        }
        .ranking-item:last-child { border-bottom: none; }

        /* TEXTO DA VERSÃO */
        .versao-app {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            pointer-events: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="bg-blur"></div>

    <!-- ECRÃ DE LOGIN -->
    <div id="login-screen" class="screen active">
        <div class="glass-panel">
            <h1>Imagination</h1>
            <div class="subtitle">O Jogo das Cartas Surreais</div>
            <input type="text" id="nome-input" placeholder="Seu Nickname">
            <input type="number" id="sala-input" placeholder="Código da Sala (Ex: 1234)">
            <button onclick="entrarSala()">Entrar na Sala</button>
        </div>
    </div>

    <!-- ECRÃ DO LOBBY -->
    <div id="lobby-screen" class="screen">
        <div class="glass-panel">
            <h1 id="lobby-titulo">Sala: ----</h1>
            <div class="subtitle" id="lobby-status">Aguardando jogadores...</div>
            <div class="ranking-list" id="jogadores-list"></div>
            <button id="btn-iniciar" style="margin-top: 20px; display: none;" onclick="iniciarPartida()">Iniciar Jogo</button>
        </div>
    </div>

    <!-- ECRÃ DE JOGO / ESCOLHA -->
    <div id="game-screen" class="screen">
        <h2 id="fase-titulo">Escolha sua Carta</h2>
        <div class="subtitle" id="fase-instrucao">Aguarde as instruções...</div>
        <div class="cards-container" id="hand-container"></div>
        <button id="btn-acao-escolha" disabled>Escolher Carta Centrada</button>
    </div>

    <!-- ECRÃ DE VOTAÇÃO (MESA) -->
    <div id="voting-screen" class="screen">
        <h2>Votação</h2>
        <div class="subtitle" id="votacao-instrucao">Qual é a carta do Narrador?</div>
        <div class="cards-container" id="table-container"></div>
        <button id="btn-votar" disabled>Votar na Carta Centrada</button>
    </div>

    <!-- ECRÃ DE RESULTADOS DA RONDA -->
    <div id="results-screen" class="screen">
        <h2 style="color: #facc15; text-shadow: 0 0 10px rgba(250,204,21,0.5);">Resultados da Ronda</h2>
        <div class="subtitle">A carta com brilho dourado era do Narrador!</div>
        <div class="cards-container" id="results-container"></div>
        <button class="btn-secondary" onclick="verRanking()">Ver Ranking</button>
    </div>

    <!-- ECRÃ DE RANKING FINAL -->
    <div id="ranking-screen" class="screen">
        <div class="glass-panel" style="max-width: 500px;">
            <h2>Ranking Atual</h2>
            <div class="ranking-list" id="ranking-container" style="max-height: 400px; margin-bottom: 20px;"></div>
            <button onclick="proximaRodada()">Próxima Rodada</button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MARCADOR DE VERSÃO (Altere aqui no futuro) -->
    <!-- ========================================== -->
    <div class="versao-app">Versão 10.63</div>

    <script>
        const socket = io();
        let minhaSala = null;
        let meuId = null;
        let cartaSelecionadaVisivel = null; 

        socket.on('connect', () => { meuId = socket.id; });

        function mostrarTela(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function entrarSala() {
            const nome = document.getElementById('nome-input').value.trim();
            const codigo = document.getElementById('sala-input').value.trim();
            if(nome && codigo) socket.emit('entrarSala', { nome, codigo });
        }

        function iniciarPartida() {
            if(minhaSala) socket.emit('iniciarPartida', document.getElementById('sala-input').value);
        }

        function proximaRodada() {
            socket.emit('proximaRodada', document.getElementById('sala-input').value);
        }

        function verRanking() {
            mostrarTela('ranking-screen');
        }

        function setupCarousel(containerId, btnId, callbackAcao, regraDesativacao) {
            const container = document.getElementById(containerId);
            const btn = document.getElementById(btnId);
            
            container.addEventListener('scroll', () => {
                let centerOffset = container.scrollLeft + container.clientWidth / 2;
                let cards = Array.from(container.children);
                let closestCard = null;
                let minDistance = Infinity;

                cards.forEach(card => {
                    let cardCenter = card.offsetLeft + card.clientWidth / 2;
                    let distance = Math.abs(centerOffset - cardCenter);
                    if (distance < minDistance) {
                        minDistance = distance;
                        closestCard = card;
                    }
                });

                if (closestCard) {
                    cartaSelecionadaVisivel = closestCard.dataset.url;
                    if (regraDesativacao && regraDesativacao(closestCard)) {
                        btn.disabled = true;
                    } else {
                        btn.disabled = false;
                        btn.onclick = () => callbackAcao(cartaSelecionadaVisivel);
                    }
                }
            });
        }

        socket.on('atualizarSala', (sala) => {
            minhaSala = sala;
            const codigo = document.getElementById('sala-input').value;
            const eu = sala.jogadores.find(j => j.id === meuId);
            const isNarrador = sala.jogadores[sala.narradorIndex].id === meuId;

            // 1. FASE DE LOBBY
            if (sala.estado === 'aguardando') {
                mostrarTela('lobby-screen');
                document.getElementById('lobby-titulo').innerText = `Sala: ${codigo}`;
                
                let htmlList = '';
                sala.jogadores.forEach(j => {
                    htmlList += `<div class="ranking-item"><span>${j.nome}</span></div>`;
                });
                document.getElementById('jogadores-list').innerHTML = htmlList;

                const isHost = sala.jogadores[0].id === meuId;
                const btnIniciar = document.getElementById('btn-iniciar');
                if (isHost && sala.jogadores.length >= 2 && sala.bau.length > 0) {
                    btnIniciar.style.display = 'block';
                    document.getElementById('lobby-status').innerText = "Pronto para começar!";
                } else if (sala.bau.length === 0) {
                    document.getElementById('lobby-status').innerText = "A carregar cartas...";
                    btnIniciar.style.display = 'none';
                }
            }

            // 2. FASE: ESCOLHA DO NARRADOR
            if (sala.estado === 'escolha_narrador') {
                mostrarTela('game-screen');
                const btn = document.getElementById('btn-acao-escolha');
                
                if (isNarrador) {
                    document.getElementById('fase-titulo').innerText = "VOCÊ É O NARRADOR!";
                    document.getElementById('fase-instrucao').innerText = "Diga a sua dica em voz alta e escolha uma carta.";
                    renderizarCartas(eu.mao, 'hand-container');
                    setupCarousel('hand-container', 'btn-acao-escolha', (url) => socket.emit('jogarCarta', { codigo, cartaUrl: url }));
                } else {
                    document.getElementById('fase-titulo').innerText = "Aguarde o Narrador...";
                    document.getElementById('fase-instrucao').innerText = "O narrador está a pensar na dica.";
                    document.getElementById('hand-container').innerHTML = ''; 
                    btn.disabled = true;
                }
            }

            // 3. FASE: ESCOLHA DOS JOGADORES
            if (sala.estado === 'escolha_jogadores') {
                mostrarTela('game-screen');
                const btn = document.getElementById('btn-acao-escolha');
                
                if (isNarrador) {
                    document.getElementById('fase-titulo').innerText = "Aguardando Jogadores...";
                    document.getElementById('fase-instrucao').innerText = "Os outros jogadores estão a tentar confundir a mesa.";
                    document.getElementById('hand-container').innerHTML = '';
                    btn.disabled = true;
                } else {
                    const jaJogou = sala.mesa.some(c => c.jogadorId === meuId);
                    if (jaJogou) {
                        document.getElementById('fase-titulo').innerText = "Carta enviada!";
                        document.getElementById('fase-instrucao').innerText = "Aguarde os restantes jogadores...";
                        document.getElementById('hand-container').innerHTML = '';
                        btn.disabled = true;
                    } else {
                        document.getElementById('fase-titulo').innerText = "A dica foi dada!";
                        document.getElementById('fase-instrucao').innerText = "Escolha uma carta da sua mão que combine com a dica.";
                        renderizarCartas(eu.mao, 'hand-container');
                        setupCarousel('hand-container', 'btn-acao-escolha', (url) => socket.emit('jogarCarta', { codigo, cartaUrl: url }));
                    }
                }
            }

            // 4. FASE: VOTAÇÃO
            if (sala.estado === 'votacao') {
                mostrarTela('voting-screen');
                const btn = document.getElementById('btn-votar');
                const jaVotou = sala.mesa.some(c => c.votos.includes(meuId));
                
                const urlsMesa = sala.mesa.map(c => c.cartaUrl);
                renderizarCartas(urlsMesa, 'table-container', sala.mesa); 

                if (isNarrador) {
                    document.getElementById('votacao-instrucao').innerText = "O Narrador não vota. Assista ao caos!";
                    btn.disabled = true;
                } else if (jaVotou) {
                    document.getElementById('votacao-instrucao').innerText = "Voto registado. Aguarde os outros...";
                    btn.disabled = true;
                } else {
                    document.getElementById('votacao-instrucao').innerText = "Deslize e vote na carta que acha ser a do Narrador.";
                    setupCarousel('table-container', 'btn-votar', 
                        (url) => socket.emit('votarCarta', { codigo, cartaUrl: url }),
                        (cardElement) => cardElement.dataset.dono === meuId
                    );
                }
            }

            // 5. FASE: RESULTADOS
            if (sala.estado === 'resultado') {
                mostrarTela('results-screen');
                const container = document.getElementById('results-container');
                container.innerHTML = '';
                
                sala.mesa.forEach(cartaObj => {
                    const dono = sala.jogadores.find(j => j.id === cartaObj.jogadorId);
                    const isCardNarrador = cartaObj.cartaUrl === sala.cartaNarradorUrl;
                    
                    const votosNomes = cartaObj.votos.map(vId => {
                        const qmVotou = sala.jogadores.find(j => j.id === vId);
                        return qmVotou ? qmVotou.nome : '';
                    }).join(', ');

                    const div = document.createElement('div');
                    div.className = 'carta';
                    if (isCardNarrador) div.classList.add('carta-narrador');
                    div.style.backgroundImage = `url('${cartaObj.cartaUrl}')`;
                    
                    div.innerHTML = `
                        <div class="carta-info">
                            <div class="dono-texto ${isCardNarrador ? 'dono-narrador' : ''}">
                                De: ${dono ? dono.nome : 'Desc.'} ${isCardNarrador ? '⭐' : ''}
                            </div>
                            <div class="votos-texto">Votos: ${cartaObj.votos.length} ${votosNomes ? '('+votosNomes+')' : ''}</div>
                        </div>
                    `;
                    container.appendChild(div);
                });
                
                let rankingHtml = '';
                [...sala.jogadores].sort((a,b) => b.pontos - a.pontos).forEach(j => {
                    rankingHtml += `<div class="ranking-item"><span>${j.nome}</span> <span>${j.pontos} pts</span></div>`;
                });
                document.getElementById('ranking-container').innerHTML = rankingHtml;
            }
        });

        function renderizarCartas(urls, containerId, mesaData = null) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            urls.forEach(url => {
                const div = document.createElement('div');
                div.className = 'carta';
                div.style.backgroundImage = `url('${url}')`;
                div.dataset.url = url;
                
                if (mesaData) {
                    const cartaObj = mesaData.find(c => c.cartaUrl === url);
                    if (cartaObj) div.dataset.dono = cartaObj.jogadorId;
                }
                
                container.appendChild(div);
            });
            container.dispatchEvent(new Event('scroll'));
        }
    </script>
</body>
</html>
