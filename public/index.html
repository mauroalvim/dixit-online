<body>
    <h1>Dixit Online</h1>
    
    <!-- TELA 1: Menu Inicial -->
    <div id="initialMenu">
        <h3>Bem-vindo! O que você deseja fazer?</h3>
        <button onclick="showCreateRoom()">Criar Nova Sala (Host)</button>
        <br><br>
        <button onclick="showJoinRoom()">Entrar em uma Sala Existente</button>
    </div>

    <!-- TELA 2: Formulário para Entrar na Sala (Escondido por padrão) -->
    <div id="joinForm" style="display:none;">
        <h3>Entrar na Sala</h3>
        <input type="text" id="roomId" placeholder="Código da Sala">
        <br><br>
        <input type="text" id="playerName" placeholder="Seu Nome">
        <br><br>
        <button onclick="joinRoom()">Entrar</button>
        <br><br>
        <button onclick="backToMenu()">Voltar</button>
    </div>

    <!-- TELA 3: Tela do Jogo (Escondido por padrão) -->
    <div id="game" style="display:none;">
        <h2 id="roomCodeDisplay"></h2>
        <div id="playersList"></div>
        <button id="startBtn" style="display:none;" onclick="startGame()">Iniciar Partida</button>
        <div id="hand"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myRoomId = '';

        // --- FUNÇÕES DE NAVEGAÇÃO DA TELA ---
        function showCreateRoom() {
            // Se o usuário clicar em criar sala, já chama a criação direto
            createRoom(); 
        }

        function showJoinRoom() {
            document.getElementById('initialMenu').style.display = 'none';
            document.getElementById('joinForm').style.display = 'block';
        }

        function backToMenu() {
            document.getElementById('joinForm').style.display = 'none';
            document.getElementById('initialMenu').style.display = 'block';
        }

        // --- LÓGICA DO JOGO (SOCKET.IO) ---
        function createRoom() {
            socket.emit('createRoom', { targetScore: 30 });
        }

        socket.on('roomCreated', ({ roomId }) => {
            myRoomId = roomId;
            document.getElementById('initialMenu').style.display = 'none';
            document.getElementById('joinForm').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            document.getElementById('roomCodeDisplay').innerText = 'Sua Sala foi criada! Código: ' + roomId;
            document.getElementById('startBtn').style.display = 'inline-block';
        });

        function joinRoom() {
            const room = document.getElementById('roomId').value.toUpperCase();
            const name = document.getElementById('playerName').value;
            
            if(!room || !name) {
                alert("Por favor, preencha o código da sala e o seu nome!");
                return;
            }

            socket.emit('joinRoom', { roomId: room, playerName: name });
        }

        socket.on('joinedSuccess', ({ roomId, playerName }) => {
            myRoomId = roomId;
            document.getElementById('initialMenu').style.display = 'none';
            document.getElementById('joinForm').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            document.getElementById('roomCodeDisplay').innerText = 'Conectado na Sala: ' + roomId;
        });

        // Adicionando o aviso caso a sala não exista (como conversamos antes)
        socket.on('joinError', ({ message }) => {
            alert(message);
        });

        socket.on('playerJoined', ({ players }) => {
            document.getElementById('playersList').innerText = 'Jogadores: ' + players.map(p => p.name).join(', ');
        });

        function startGame() {
            socket.emit('startGame', { roomId: myRoomId });
        }

        socket.on('gameStarted', ({ players, status }) => {
            document.getElementById('startBtn').style.display = 'none';
            const me = players.find(p => p.id === socket.id);
            if(me) {
                const handDiv = document.getElementById('hand');
                handDiv.innerHTML = '<h3>Sua Mão:</h3>';
                me.hand.forEach(url => {
                    const img = document.createElement('img');
                    img.src = url;
                    img.className = 'card';
                    handDiv.appendChild(img);
                });
                if(me.isNarrator) alert('Você é o narrador dessa rodada!');
            }
        });
    </script>
</body>
