<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dixit Online</title>
    <style>
        /* --- ESTILOS GLOBAIS E FUNDO DESFOCADO (Estilo v10.10) --- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://images.unsplash.com/photo-1618331835717-801e976710b2?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(30, 30, 40, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: -1;
        }

        /* --- TÍTULO PRINCIPAL --- */
        .main-title-container {
            text-align: center;
            margin-top: 50px;
            margin-bottom: 20px;
        }
        
        .main-title {
            font-size: 3.5rem;
            font-weight: 900;
            margin: 0;
            letter-spacing: 1px;
            text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.6);
        }

        .sparkles {
            font-size: 2rem;
            margin-top: -10px;
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.8);
        }

        /* --- CARD DE LOGIN IDÊNTICO AO PRINT --- */
        .login-card {
            background-color: #1a1a24;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .login-header {
            padding: 30px 20px 15px 20px;
            text-align: center;
        }

        .login-header h3 {
            color: #2ecc71;
            margin: 0;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-header p {
            color: #d1d1d1;
            font-size: 0.95rem;
            margin-top: 15px;
            margin-bottom: 0;
        }

        .login-body {
            padding: 15px 25px 30px 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            background-color: #111115;
            border: 1px solid #2a2a35;
            color: white;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: border 0.3s;
            width: calc(100% - 32px); /* Ajuste de padding */
        }

        input:focus {
            border: 1px solid #2ecc71;
        }

        input::placeholder { color: #666; }

        button.btn-avancar {
            background: linear-gradient(90deg, #2ecc71, #229954);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
            transition: transform 0.2s;
            width: 100%;
        }

        button.btn-avancar:active { transform: scale(0.96); }

        .btn-voltar {
            background: transparent;
            color: #aaa;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 5px;
            padding: 10px;
            text-decoration: underline;
        }

        .login-footer {
            background-color: #14141c;
            padding: 25px;
            text-align: center;
            color: #f1c40f;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            transition: background 0.3s;
        }
        
        .login-footer:active { background-color: #1a1a24; }

        /* --- TELA DO JOGO --- */
        .game-container {
            background-color: #1a1a24;
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 600px;
            margin-top: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .destaque { color: #f1c40f; margin-top: 0;}
        .narrador-texto { color: #2ecc71; font-weight: bold; font-size: 1.3rem; margin-bottom: 5px; text-transform: uppercase;}

        .info-mesa {
            background: #111115;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #2a2a35;
        }

        .deck {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        .carta {
            width: 105px;
            height: 155px;
            border-radius: 10px;
            object-fit: cover;
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            border: 2px solid transparent;
        }

        .carta:hover {
            transform: scale(1.05);
            border: 2px solid #2ecc71;
        }

        .btn-acao {
            background: #111115;
            border: 1px solid #2a2a35;
            color: white;
            padding: 15px;
            border-radius: 20px;
            margin-top: 25px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: 0.3s;
        }

        .versao { margin-top: 20px; color: #888; font-size: 0.9rem; text-align: center; }

        /* --- MODAL CARROSSEL --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(10, 10, 15, 0.95);
        }
        
        .modal:not(.hidden) {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .close {
            position: absolute; top: 20px; right: 30px;
            color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; z-index: 1010;
        }

        .carousel-container {
            display: flex; align-items: center; justify-content: center;
            position: relative; width: 100%; height: 65vh; touch-action: pan-y;
        }

        .modal-content {
            max-width: 90%; max-height: 100%; border-radius: 15px;
            object-fit: contain; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transition: opacity 0.2s ease-in-out;
        }

        .carousel-nav {
            background: rgba(255, 255, 255, 0.1); color: white; border: none;
            font-size: 2rem; padding: 15px 10px; cursor: pointer;
            position: absolute; z-index: 10; border-radius: 8px; transition: 0.3s;
        }

        #prevBtn { left: 10px; } #nextBtn { right: 10px; }
        .zoom-action-container { text-align: center; margin-top: 30px; }

        #btnEscolherCarta {
            background: linear-gradient(90deg, #2ecc71, #229954); color: white;
            font-size: 1.2rem; font-weight: bold; padding: 15px 40px; border: none;
            border-radius: 30px; cursor: pointer; box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
        }
    </style>
</head>
<body>

    <div class="main-title-container" id="tituloApp">
        <h1 class="main-title">Dixit Online</h1>
        <div class="sparkles">✨</div>
    </div>

    <!-- TELA DE ENTRADA (Múltiplas Etapas) -->
    <div class="login-card" id="telaEntrada">
        
        <!-- PASSO 1: Código da Sala (Para Convidados) -->
        <div id="stepCodigo">
            <div class="login-header">
                <h3>🎮 Entrar na Partida</h3>
                <p>Digite o código fornecido pelo Host.</p>
            </div>
            <div class="login-body">
                <input type="number" id="codigoSala" placeholder="Código da Sala (Ex: 1234)">
                <button class="btn-avancar" onclick="avancarParaNome(false)">Avançar</button>
            </div>
            <div class="login-footer" onclick="avancarParaNome(true)">
                👑 Criar uma nova sala? Clique aqui ▼
            </div>
        </div>

        <!-- PASSO 2: Nome do Jogador (Host ou Convidado) -->
        <div id="stepNome" style="display: none;">
            <div class="login-header">
                <h3 id="tituloPassoNome">👤 Seu Perfil</h3>
                <p id="subtituloPassoNome">Como os outros jogadores vão te chamar?</p>
            </div>
            <div class="login-body">
                <input type="text" id="nomeJogador" placeholder="Seu Nome (Ex: João)">
                <button class="btn-avancar" onclick="finalizarEntrada()">Entrar na Sala</button>
                <button class="btn-voltar" onclick="voltarParaCodigo()">Voltar</button>
            </div>
        </div>

    </div>

    <!-- TELA DO JOGO -->
    <div class="game-container" id="telaJogo" style="display: none;">
        <h2 class="destaque">Sala: <span id="displayCodigo"></span></h2>
        <div class="info-mesa"><span style="color:#aaa;">Na Mesa:</span> <strong id="displayJogadores"></strong></div>
        <div id="statusNarrador" style="margin-bottom: 20px;"></div>
        <div class="deck" id="deckCartas"></div>
        <button class="btn-acao" onclick="recarregarCartas()">🔄 Recarregar Cartas na Tela</button>
    </div>

    <div class="versao" id="versaoApp">Versão 10.35</div>

    <!-- MODAL CARROSSEL -->
    <div id="zoomModal" class="modal hidden">
        <span class="close" onclick="fecharModal()">&times;</span>
        <div class="carousel-container">
            <button id="prevBtn" class="carousel-nav" onclick="navegarCarrossel(-1)">&#10094;</button>
            <img id="imgZoom" class="modal-content" src="">
            <button id="nextBtn" class="carousel-nav" onclick="navegarCarrossel(1)">&#10095;</button>
        </div>
        <div class="zoom-action-container">
            <button id="btnEscolherCarta" onclick="confirmarCartaDoZoom()">🌟 Escolher esta Carta</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let codigoAtual = null;
        let isCriandoSala = false;
        let cartasNoDeckAtual = []; 
        let indiceCarrosselAtual = 0;

        // --- Lógica de Telas de Login ---
        function avancarParaNome(criarNova) {
            isCriandoSala = criarNova;
            
            if (!isCriandoSala) {
                const cod = document.getElementById('codigoSala').value;
                if (!cod) {
                    alert('Digite o código da sala fornecido pelo Host!');
                    return;
                }
                document.getElementById('tituloPassoNome').innerHTML = '👤 Seu Perfil';
                document.getElementById('subtituloPassoNome').innerText = 'Como os outros jogadores vão te chamar?';
            } else {
                document.getElementById('tituloPassoNome').innerHTML = '👑 Criar Sala';
                document.getElementById('subtituloPassoNome').innerText = 'Digite seu nome para ser o Host da nova sala.';
            }

            document.getElementById('stepCodigo').style.display = 'none';
            document.getElementById('stepNome').style.display = 'block';
        }

        function voltarParaCodigo() {
            document.getElementById('stepNome').style.display = 'none';
            document.getElementById('stepCodigo').style.display = 'block';
        }

        function finalizarEntrada() {
            const nome = document.getElementById('nomeJogador').value;
            let codigo = document.getElementById('codigoSala').value;

            if(!nome) {
                alert("Por favor, preencha o seu nome.");
                return;
            }

            // Se for criar sala, o sistema gera um código numérico aleatório de 4 dígitos
            if(isCriandoSala) {
                codigo = Math.floor(1000 + Math.random() * 9000).toString();
            }

            codigoAtual = codigo;
            socket.emit('entrarSala', { nome, codigo });
            
            // Oculta tudo de Login e Mostra Jogo
            document.getElementById('telaEntrada').style.display = 'none';
            document.getElementById('tituloApp').style.display = 'none';
            document.getElementById('versaoApp').style.display = 'none';
            document.getElementById('telaJogo').style.display = 'block';
            document.getElementById('displayCodigo').innerText = codigo;
        }

        // --- Lógica do Servidor e Jogo ---
        socket.on('atualizarSala', (sala) => {
            const eu = sala.jogadores.find(j => j.id === socket.id);
            if(!eu) return;

            const nomesMesa = sala.jogadores.map(j => j.nome).join(', ');
            document.getElementById('displayJogadores').innerText = nomesMesa;

            const souNarrador = sala.jogadores.findIndex(j => j.id === socket.id) === sala.narradorIndex;
            const statusDiv = document.getElementById('statusNarrador');
            
            if (souNarrador) {
                statusDiv.innerHTML = `
                    <div class="narrador-texto">Você é o Narrador!</div>
                    <div style="font-size: 0.95rem; color: #aaa;">Fale a sua dica em voz alta e escolha uma carta.</div>
                `;
            } else {
                statusDiv.innerHTML = `<div style="font-size: 1.1rem; color: #f1c40f; font-weight: bold;">Aguardando o Narrador...</div>`;
            }

            cartasNoDeckAtual = eu.mao;
            renderizarDeck();
        });

        function renderizarDeck() {
            const deckDiv = document.getElementById('deckCartas');
            deckDiv.innerHTML = '';
            
            cartasNoDeckAtual.forEach((cartaUrl, index) => {
                const img = document.createElement('img');
                img.src = cartaUrl;
                img.className = 'carta';
                img.onclick = () => abrirZoom(index);
                deckDiv.appendChild(img);
            });
        }

        function recarregarCartas() { renderizarDeck(); }

        // --- Lógica do Carrossel e Swipe ---
        function abrirZoom(indiceDaCartaClicada) {
            indiceCarrosselAtual = indiceDaCartaClicada;
            atualizarImagemCarrossel();
            document.getElementById('zoomModal').classList.remove('hidden');
        }

        function fecharModal() {
            document.getElementById('zoomModal').classList.add('hidden');
        }

        function atualizarImagemCarrossel() {
            const imgZoom = document.getElementById('imgZoom');
            imgZoom.style.opacity = '0.3';
            setTimeout(() => {
                imgZoom.src = cartasNoDeckAtual[indiceCarrosselAtual];
                imgZoom.style.opacity = '1';
            }, 100);
            
            document.getElementById('prevBtn').style.display = (indiceCarrosselAtual === 0) ? 'none' : 'block';
            document.getElementById('nextBtn').style.display = (indiceCarrosselAtual === cartasNoDeckAtual.length - 1) ? 'none' : 'block';
        }

        function navegarCarrossel(direcao) {
            indiceCarrosselAtual += direcao;
            if (indiceCarrosselAtual < 0) indiceCarrosselAtual = 0;
            if (indiceCarrosselAtual >= cartasNoDeckAtual.length) indiceCarrosselAtual = cartasNoDeckAtual.length - 1;
            atualizarImagemCarrossel();
        }

        function confirmarCartaDoZoom() {
            const cartaSelecionadaUrl = cartasNoDeckAtual[indiceCarrosselAtual];
            fecharModal();
            socket.emit('jogarCarta', { codigo: codigoAtual, cartaUrl: cartaSelecionadaUrl });
        }

        let toqueInicialX = 0; let toqueFinalX = 0;
        const areaZoom = document.getElementById('imgZoom');

        areaZoom.addEventListener('touchstart', (e) => { toqueInicialX = e.changedTouches[0].screenX; });
        areaZoom.addEventListener('touchend', (e) => { toqueFinalX = e.changedTouches[0].screenX; processarSwipe(); });

        function processarSwipe() {
            const limiteSwipe = 40;
            if (toqueFinalX < toqueInicialX - limiteSwipe) navegarCarrossel(1);
            if (toqueFinalX > toqueInicialX + limiteSwipe) navegarCarrossel(-1);
        }
    </script>
</body>
</html>
