<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dixit Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Poppins', sans-serif; 
            text-align: center; 
            min-height: 100vh;
            background-color: #1a1a2e;
            background-image: 
                linear-gradient(rgba(26, 26, 46, 0.7), rgba(26, 26, 46, 0.9)), 
                url('https://images.unsplash.com/photo-1541701494587-cb58502866ab?q=80&w=2070&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h1 { font-weight: 800; font-size: 2.8em; text-shadow: 0px 4px 15px rgba(0,0,0,0.9); margin: 20px 0; color: #fff; letter-spacing: 2px;}
        
        .glass-panel {
            background: rgba(20, 20, 35, 0.85); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 25px 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 420px; 
            margin-bottom: 20px;
        }

        button { 
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white; 
            border: none; 
            border-radius: 25px; 
            padding: 14px 24px; 
            font-size: 16px; 
            font-weight: 600;
            width: 100%; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(110, 142, 251, 0.3);
            transition: 0.3s;
            margin-top: 15px;
        }
        button:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(110, 142, 251, 0.5); }
        .btn-cancel { background: linear-gradient(135deg, #ff416c, #ff4b2b); box-shadow: 0 4px 15px rgba(255, 65, 108, 0.3); }

        input { 
            width: 100%; 
            padding: 14px; 
            font-size: 16px; 
            border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.2); 
            background: rgba(0,0,0,0.5);
            color: white;
            text-align: center; 
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: 0.3s;
            margin-top: 10px;
        }
        input:focus { border-color: #a777e3; background: rgba(0,0,0,0.7); }
        
        #hand { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 12px; 
            margin-top: 20px; 
            width: 100%;
        }
        
        /* CARTA BLINDADA: A tag DIV impede os ícones quebrados */
        .card { 
            width: calc(33.33% - 12px); 
            max-width: 130px; 
            aspect-ratio: 2 / 3; 
            border-radius: 12px; 
            cursor: pointer; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            border: 3px solid transparent; 
            transition: 0.3s; 
            position: relative;
            background-color: #161b22;
            background-size: cover;
            background-position: center;
        }
        .card:hover { transform: translateY(-8px); border-color: #a777e3; }
        
        .card-loading {
            background: linear-gradient(90deg, #161b22, #3b2a50, #161b22);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .my-card-disabled { opacity: 0.3; cursor: not-allowed; border-color: #ff4b2b !important; transform: none !important; }
        .narrator-card-view { cursor: default; }
        .narrator-card-view:hover { transform: none; border-color: transparent; }
        .locked-card { opacity: 0.7; filter: grayscale(30%); }
        .locked-card:hover { transform: none; border-color: transparent; cursor: wait; }
        
        .ranking-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: rgba(0,0,0,0.6); border-radius: 12px; overflow: hidden; }
        .ranking-table th, .ranking-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .ranking-table th { background: rgba(255,255,255,0.1); color: #a777e3; font-size: 14px; text-transform: uppercase; }
        
        .status-text { margin-bottom: 15px; font-size: 1.1em; line-height: 1.4; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        .winner-title { font-size: 2em; color: #f1c40f; text-shadow: 0 0 20px rgba(241, 196, 15, 0.6); animation: pulse 2s infinite; margin: 20px 0; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); backdrop-filter: blur(8px); padding: 20px; }
        .modal-content { position: relative; top: 50%; transform: translateY(-50%); background: #161b22; padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; margin: 0 auto; box-shadow: 0 20px 50px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.1); }
        .modal-img { width: 100%; max-height: 55vh; object-fit: contain; border-radius: 12px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Dixit Online ✨</h1>
    
    <div id="initialMenu" class="glass-panel">
        <div style="background: rgba(0,0,0,0.3); padding: 25px 20px; border-radius: 15px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1);">
            <h3 style="color: #38ef7d; margin-bottom: 15px; font-size: 1.4em;">🎮 Entrar na Partida</h3>
            <p style="font-size: 14px; opacity: 0.9; margin-bottom: 15px;">Digite o código fornecido pelo Host.</p>
            <input type="number" id="roomIdCheck" placeholder="Código (Ex: 1234)">
            <button onclick="checkRoom()" style="background: linear-gradient(135deg, #11998e, #38ef7d); margin-top: 15px; padding: 16px; font-size: 1.1em;">Avançar</button>
        </div>

        <div style="background: rgba(0,0,0,0.2); padding: 20px; border-radius: 15px; cursor: pointer;" id="hostToggleBtn" onclick="toggleHostMenu()">
            <h4 style="color: #f1c40f; margin: 0;">👑 Criar uma nova sala? Clique aqui ▼</h4>
        </div>
        
        <div id="hostMenu" style="display: none; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 15px; margin-top: 5px;">
            <input type="text" id="hostPlayerName" placeholder="Seu Apelido de Host">
            <label style="font-size: 13px; opacity: 0.8; display: block; margin-top: 15px;">Pontos para Vencer (Ex: 30):</label>
            <input type="number" id="targetScoreInput" value="30">
            <button onclick="showCreateRoom()" style="background: rgba(255,255,255,0.1); box-shadow: none; border: 1px solid rgba(255,255,255,0.2);">Criar Sala</button>
        </div>
    </div>

    <div id="joinNameForm" class="glass-panel" style="display:none;">
        <h3 style="margin-bottom: 15px; color: #a777e3;">Sala Encontrada! 🎉</h3>
        <p style="font-size: 14px; opacity: 0.9; margin-bottom: 20px;">Como os jogadores devem te chamar?</p>
        <input type="text" id="guestPlayerName" placeholder="Digite seu Apelido">
        <button onclick="joinRoom()" style="background: linear-gradient(135deg, #a777e3, #6e8efb);">Entrar no Jogo</button>
        <button onclick="backToMenu()" class="btn-cancel">Cancelar</button>
    </div>

    <div id="game" class="glass-panel" style="display:none; max-width: 650px;">
        <h2 id="roomCodeDisplay" style="color: #f1c40f; margin-bottom: 10px; text-shadow: 1px 1px 5px rgba(0,0,0,0.5);"></h2>
        
        <div id="playersList" style="opacity: 0.9; margin-bottom: 20px; font-size: 15px; background: rgba(0,0,0,0.4); padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);"></div>
        
        <div id="dynamicMessages">
            <h3 id="waitingMessage" style="color: #38ef7d; display:none;">Aguardando jogadores entrarem...</h3>
            <div id="actionInstruction" class="status-text"></div>
        </div>
        
        <button id="startBtn" style="display:none;" onclick="startGame()">Iniciar Partida</button>
        
        <div id="hand"></div>
    </div>

    <div id="cardModal" class="modal">
        <div class="modal-content">
            <img id="modalImage" class="modal-img" src="">
            <div id="modalButtons">
                <button id="btnConfirmModal" class="btn-confirm" onclick="handleConfirmModal()">Confirmar</button>
                <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myRoomId = '';
        let pendingRoomIdToJoin = ''; 
        let selectedCardUrl = '';
        let myPlayedCardUrl = ''; 
        let modalAction = 'PLAY'; 
        let myHandElements = [];
        let amINarrator = false;
        let narratorHasPlayed = false;

        function toggleHostMenu() {
            const menu = document.getElementById('hostMenu');
            menu.style.display = (menu.style.display === 'none') ? 'block' : 'none';
        }

        function showCreateRoom() {
            const name = document.getElementById('hostPlayerName').value;
            const targetScore = document.getElementById('targetScoreInput').value;
            if(!name) return alert("Por favor, digite seu apelido de Host!");
            socket.emit('createRoom', { targetScore: targetScore, playerName: name });
        }

        socket.on('roomCreated', ({ roomId, players }) => {
            myRoomId = roomId;
            document.getElementById('initialMenu').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            document.getElementById('roomCodeDisplay').innerText = 'Código da Sala: ' + roomId;
            document.getElementById('waitingMessage').style.display = 'block';
            updatePlayersList(players);
        });

        function checkRoom() {
            const room = document.getElementById('roomIdCheck').value;
            if(!room) return alert("Digite o código da sala!");
            socket.emit('validateRoom', { roomId: room });
        }

        socket.on('roomValidated', ({ roomId }) => {
            pendingRoomIdToJoin = roomId;
            document.getElementById('initialMenu').style.display = 'none';
            document.getElementById('joinNameForm').style.display = 'block';
        });

        socket.on('joinError', ({ message }) => alert(message));

        function joinRoom() {
            const name = document.getElementById('guestPlayerName').value;
            if(!name) return alert("Por favor, digite seu apelido para entrar!");
            socket.emit('joinRoom', { roomId: pendingRoomIdToJoin, playerName: name });
        }

        socket.on('joinedSuccess', ({ roomId }) => {
            myRoomId = roomId;
            document.getElementById('joinNameForm').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            document.getElementById('roomCodeDisplay').innerText = 'Sala: ' + roomId;
            document.getElementById('waitingMessage').style.display = 'none'; 
        });

        function backToMenu() {
            document.getElementById('joinNameForm').style.display = 'none';
            document.getElementById('initialMenu').style.display = 'block';
            pendingRoomIdToJoin = '';
        }

        socket.on('playerJoined', ({ players }) => {
            updatePlayersList(players);
            if (players.length > 1) {
                document.getElementById('waitingMessage').style.display = 'none';
                if(document.getElementById('roomCodeDisplay').innerText.includes('Código da Sala:')) {
                    document.getElementById('startBtn').style.display = 'block';
                }
            }
        });

        function updatePlayersList(players) {
            document.getElementById('playersList').innerHTML = '<strong>Na Mesa:</strong> ' + players.map(p => p.name).join(', ');
        }

        // --- SISTEMA FANTASMA DE PRE-LOAD NO LOBBY ---
        socket.on('preloadCards', ({ cards }) => {
            console.log("Iniciando Buffer Invisível...");
            cards.forEach((url, i) => {
                // Intervalos de 600ms para baixar o baralho silenciosamente sem bloquear o celular
                setTimeout(() => {
                    const img = new Image();
                    img.src = url;
                }, i * 600); 
            });
        });

        function startGame() { socket.emit('startGame', { roomId: myRoomId }); }
        function nextRound() { socket.emit('nextRound', { roomId: myRoomId }); }

        // --- FUNÇÃO BLINDADA: RENDERIZA O DIV EM VEZ DO IMG QUEBRADO ---
        function appendCardToBoard(url, isVotingPhase = false) {
            const handDiv = document.getElementById('hand');
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card card-loading'; // Começa com a animação de brilho
            
            const imgLoader = new Image();
            
            // Quando a imagem terminar de baixar (ou se já estiver no cache da memória)
            imgLoader.onload = () => {
                cardDiv.classList.remove('card-loading');
                cardDiv.style.backgroundImage = `url('${imgLoader.src}')`;
            };
            
            // Se a IA der pau, puxa o plano B instantaneamente
            imgLoader.onerror = () => {
                imgLoader.src = `https://picsum.photos/seed/${Math.random()}/300/450?blur=2`;
            };
            
            imgLoader.src = url; // Gatilho de download

            // Lógica de Cliques
            if (isVotingPhase) {
                if (amINarrator) {
                    cardDiv.classList.add('narrator-card-view');
                    cardDiv.onclick = () => alert("Você é o narrador! Apenas observe a votação.");
                } else if (url === myPlayedCardUrl) { 
                    cardDiv.classList.add('my-card-disabled');
                    cardDiv.onclick = () => alert("Você não pode votar na sua própria carta!");
                } else {
                    cardDiv.onclick = () => openModal(imgLoader.src, 'VOTE');
                }
            } else {
                if (!amINarrator && !narratorHasPlayed) {
                    cardDiv.classList.add('locked-card');
                }
                cardDiv.onclick = () => {
                    if (!amINarrator && !narratorHasPlayed) {
                        alert("Calma! Você precisa esperar o Narrador falar a dica e jogar primeiro.");
                        return;
                    }
                    openModal(imgLoader.src, 'PLAY');
                };
                myHandElements.push(cardDiv);
            }

            handDiv.appendChild(cardDiv);
        }

        socket.on('gameStarted', ({ players }) => {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('waitingMessage').style.display = 'none';
            const instructionDiv = document.getElementById('actionInstruction');
            const handDiv = document.getElementById('hand');
            
            handDiv.innerHTML = ''; 
            myHandElements = [];
            narratorHasPlayed = false;
            myPlayedCardUrl = ''; 
            
            const me = players.find(p => p.id === socket.id);
            if(me) {
                amINarrator = me.isNarrator;
                
                if(amINarrator) {
                    instructionDiv.innerHTML = '<span style="color:#38ef7d; font-weight:800; font-size:1.4em;">Você é o Narrador!</span><br>Fale sua dica em voz alta e escolha uma carta.';
                } else {
                    instructionDiv.innerHTML = '<span style="color:#f1c40f; font-weight:600; font-size:1.2em;">Aguarde...</span><br>O Narrador está dando a dica. Olhe suas cartas enquanto isso!';
                }

                // Renderiza instantaneamente! O Loading é na própria carta de forma individual.
                me.hand.forEach(url => appendCardToBoard(url, false));
            }
        });

        socket.on('narratorPlayed', () => {
            narratorHasPlayed = true;
            if (!amINarrator) {
                const instructionDiv = document.getElementById('actionInstruction');
                instructionDiv.innerHTML = '<span style="color:#6e8efb; font-weight:800; font-size:1.4em;">Sua Vez!</span><br>O Narrador deu a dica. Escolha a sua carta que mais combina com a dica.';
                myHandElements.forEach(div => div.classList.remove('locked-card'));
            }
        });

        socket.on('startVotingPhase', ({ cards }) => {
            const instructionDiv = document.getElementById('actionInstruction');
            const handDiv = document.getElementById('hand');
            handDiv.innerHTML = '';
            
            if (amINarrator) {
                instructionDiv.innerHTML = '<span style="color:#f1c40f; font-weight:800; font-size:1.3em;">Hora da Votação!</span><br>Aguarde os jogadores votarem (Você não vota).';
            } else {
                instructionDiv.innerHTML = '<span style="color:#a777e3; font-weight:800; font-size:1.4em;">Votação!</span><br>Qual destas é a carta do narrador?';
            }

            cards.forEach(url => appendCardToBoard(url, true));
        });

        socket.on('roundEnded', ({ ranking, isGameOver, targetScore, hostSocketId }) => {
            const instructionDiv = document.getElementById('actionInstruction');
            instructionDiv.innerHTML = '';
            
            let html = ``;
            if (isGameOver) {
                const vencedor = ranking[0].name;
                html += `<div class="winner-title">🏆 ${vencedor} VENCEU! 🏆</div>`;
            } else {
                html += `<h3 style="color: #a777e3; margin-bottom: 10px; font-size: 1.5em;">Fim da Rodada!</h3>`;
            }

            html += `
                <table class="ranking-table">
                    <tr><th>Pos.</th><th>Jogador</th><th>Pts</th></tr>
            `;

            ranking.forEach((p, index) => {
                let rowStyle = (index === 0) ? 'color: #f1c40f; font-weight: bold; background: rgba(241,196,15,0.2);' : '';
                let isNar = p.isNarrator ? '<br><span style="font-size:12px; color:#38ef7d; font-weight: normal;">(Narrador)</span>' : '';
                html += `
                    <tr style="${rowStyle}">
                        <td style="font-size:1.2em;">${index + 1}º</td>
                        <td>${p.name} ${isNar}</td>
                        <td style="font-size:1.4em;">${p.score}</td>
                    </tr>`;
            });
            html += `</table>`;

            if (!isGameOver && socket.id === hostSocketId) {
                html += `<button onclick="nextRound()" style="background: linear-gradient(135deg, #f1c40f, #e67e22); padding: 18px; font-size: 1.1em; margin-top: 20px;">Próxima Rodada</button>`;
            } else if (!isGameOver) {
                html += `<p style="margin-top:20px; font-size:15px; opacity:0.9;">Aguardando o Host iniciar a próxima rodada...</p>`;
            } else if (isGameOver && socket.id === hostSocketId) {
                html += `<button onclick="window.location.reload()" style="background: linear-gradient(135deg, #11998e, #38ef7d); padding: 18px; font-size: 1.1em; margin-top: 20px;">Jogar Novamente</button>`;
            }

            document.getElementById('hand').innerHTML = html;
        });

        function openModal(url, action) {
            selectedCardUrl = url;
            modalAction = action;
            document.getElementById('modalImage').src = url;
            
            const btnConfirm = document.getElementById('btnConfirmModal');
            if (action === 'PLAY') {
                btnConfirm.innerText = 'Enviar Carta para a Mesa';
                btnConfirm.style.background = 'linear-gradient(135deg, #11998e, #38ef7d)';
            } else if (action === 'VOTE') {
                btnConfirm.innerText = 'Confirmar Voto';
                btnConfirm.style.background = 'linear-gradient(135deg, #a777e3, #6e8efb)'; 
            }
            document.getElementById('cardModal').style.display = 'block';
        }

        function closeModal() { document.getElementById('cardModal').style.display = 'none'; selectedCardUrl = ''; }

        function handleConfirmModal() {
            if(!selectedCardUrl) return;
            
            if (modalAction === 'PLAY') {
                myPlayedCardUrl = selectedCardUrl; 
                socket.emit('playCard', { roomId: myRoomId, cardUrl: selectedCardUrl });
                document.getElementById('hand').innerHTML = '';
                document.getElementById('actionInstruction').innerHTML = '<span style="color: #38ef7d; font-size: 1.2em;">Carta na mesa!</span><br>Aguardando os outros jogadores...';
            } else if (modalAction === 'VOTE') {
                socket.emit('voteCard', { roomId: myRoomId, cardUrl: selectedCardUrl });
                document.getElementById('hand').innerHTML = '';
                document.getElementById('actionInstruction').innerHTML = '<span style="color: #6e8efb; font-size: 1.2em;">Voto registrado!</span><br>Aguardando apuração...';
            }
            closeModal();
        }
    </script>
</body>
</html>
