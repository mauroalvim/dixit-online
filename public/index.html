<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Imagination</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-hover: #059669;
            --panel-bg: rgba(15, 23, 42, 0.75); 
            --input-bg: rgba(0, 0, 0, 0.5); 
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
            --gold-glow: 0 0 20px rgba(250, 204, 21, 0.9);
            --red-alert: #ef4444;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        /* FUNDO ALEGRE E VIBRANTE (Tinta Abstrata) */
        body, html { 
            color: var(--text-main); 
            min-height: 100dvh; 
            overflow-x: hidden; 
            overflow-y: auto; 
            position: relative;
            background-color: #0f172a; 
            background-image: url('https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.25);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: -1;
        }

        .screen {
            display: none; flex-direction: column; min-height: 100dvh; 
            padding: 30px 20px; align-items: center; justify-content: flex-start;
        }
        .screen.active { display: flex; }

        .main-title {
            text-align: center; font-size: 42px; font-weight: 800;
            margin-top: 20px; margin-bottom: 5px; text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        .title-stars {
            text-align: center; font-size: 28px; margin-bottom: 30px; text-shadow: 0 2px 15px rgba(255, 215, 0, 0.8);
        }

        .glass-panel {
            background: var(--panel-bg); border-radius: 24px; padding: 30px 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8); border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%; max-width: 450px; display: flex; flex-direction: column;
            backdrop-filter: blur(10px);
        }

        .login-subpanel { display: none; flex-direction: column; }
        .login-subpanel.active { display: flex; }

        .panel-header {
            color: var(--primary); font-size: 24px; font-weight: 800;
            text-align: center; margin-bottom: 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle { text-align: center; color: var(--text-muted); font-size: 15px; margin-bottom: 25px; }

            width: 100%;
